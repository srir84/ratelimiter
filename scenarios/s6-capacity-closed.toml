# s6-capacity-closed (HARNESS TRF-S6, §6 FLT-8, FLT-1b; DESIGN §B4, §B5, §B6, §B10;
# IMPLEMENTATION_PLAN H6 step 1): capacity exhaustion under load in closed mode, a test-build run
# (bin/test) of three instances, one 300 req/s step of 120 s, with 3 % of the allowed requests
# refused after their acquire (refuse_after_acquire_bp = 300, ERR-15), so refunds run all along.
# FLT-8's three small shared-state limits, the plan's (max_tracked_buckets = 50,
# max_live_markers = 20, max_markers_per_key = 5), are the run's, and only max_tracked_buckets
# binds (orchestrator decision D1, H6 task 1): the 50 tracked buckets fill within the first seconds
# and bind all along, so the acquires of users without a bucket get capacity_error (ERR-10),
# nothing evicted (STA-6a). That meets HARNESS FLT-8 ("Exceed declared shared-state limits"), with
# no plan or SPEC change. Its one store outage segment is FLT-1b's wrapper refusal.
# s6-capacity-open.toml is the same run in open mode.
# Plan choices, each with its reason:
# - 200 users, Zipf 1.1 (the default): more than 50 distinct users arrive within the first seconds,
#   so the 50 bucket slots fill and the other users get ERR-10 from then on: a bucket frees only
#   once full and 60 s past its latest receipt, which the users holding the slots, each arriving at
#   least every 10 s or so, never reach.
# - The policy is 1 token per 10 s with a capacity of 1 per user, so the 50 tracked users together
#   are allowed about 6 req/s (and 50 at the start) and the refusals after acquire give about 0.2
#   refunds/s (20-30 a run): the H6 runs peaked at 16 and 17 live markers (of max_live_markers =
#   20) with no refund capacity_error, and the seed-1 simulation gives at most 2 of a key (of
#   max_markers_per_key = 5). So the marker limits never bind, and they cannot bind in a run whose
#   refunds must meet plan step 4: a refund blocked at a marker limit (API-18, retried) waits for a
#   marker to expire, 60 s after its acquire (receipt_lifetime), past refund_deadline (30 s) + the
#   outage, and refunds still pending when Close's drain ends emit their unresolved (closed) events
#   after the listener's deadline, the drain's, which drops and counts them
#   (internal/core/close.go), so listener_drops > 0 makes the run invalid (HAR-13). A first version
#   of this file with harness.toml's policy (10 tokens/s, capacity 20) showed both: of 405
#   releases 62 were applied, 261 ended unresolved (retention) and 82 final events were dropped at
#   the drain's end. Marker exhaustion stays covered at L3: T-REF-4 (a lost refund reply when the
#   marker pool is full) and T-FLT-5 (FLT-8's limits, the per-key marker limit included). A seed or
#   policy change needs the live-marker peak rechecked against 20.
# - failure_mode = "closed", harness.toml's default, set here so the file names its mode.
# - FLT-1b, the plan's outage segment for this file: 5 s (the plan's duration_ms 5000) on instance 1
#   at 60 s, mid-run; it refuses acquires only (match "acquire", DESIGN §B6), so refunds are left
#   alone, and closed mode answers the refused acquires with ERR-8.
name = "s6-capacity-closed"
seed = 1
run_kind = "test"
instances = 3

# FLT-8: HARNESS §6 "Capacity exhaustion | Exceed declared shared-state limits | `capacity_error`,
# nothing evicted"; DESIGN §B6 "`FLT-8` | Small `max_*` limits in the scenario config | config".
[policy]
failure_mode = "closed"
rate_tokens = 1
rate_period_ns = 10_000_000_000
capacity = 1
max_tracked_buckets = 50
max_live_markers = 20
max_markers_per_key = 5

[api]
refuse_after_acquire_bp = 300

[[steps]]
rate_per_s = 300
duration_s = 120

[users]
count = 200
zipf_s = 1.1

# FLT-1b, the run's one store outage segment: HARNESS §6 "Refused-connection outage, 5 s | … (b)
# store-adapter wrapper refuses before any command is sent | `unavailable` → closed `503` / open
# bypass"; DESIGN §B6 "`FLT-1` (b) refuse | Adapter wrapper returns `unavailable` without sending |
# `POST /_test/faults {target:"store", mode:"refuse", match:"acquire", duration_ms}`".
[[faults]]
at_s = 60
cmd = '{"target":"store","mode":"refuse","match":"acquire","duration_ms":5000}'
instance = 1
