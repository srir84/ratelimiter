# T-HFLT-4 (HARNESS §8: BUD-11a, TRF-10, HAR-13, HOST-8; DESIGN §C5; IMPLEMENTATION_PLAN H5 step 9,
# plan choices): refunds during faulted traffic, a test-build run of three instances, one
# 200 req/s step of 60 s over 20 users, 5 % of the requests refused after their acquire
# (refuse_after_acquire_bp = 500, ERR-15), so refunds run all along. The faults, each at its
# offset from hitgen's start:
#   10 s  instance 1 drops the replies of its next 5 refund calls (FLT-4): each is sent again and
#         ends already_applied, a known credit at its logged credit_decision_ns;
#   20 s  the store paused for 4.5 s (FLT-2): the run's one store outage segment;
#   39 s  instance 2 holds every refund call's return for 10 s after its reply (the refund
#         applies, its final event waits): not an outage segment;
#   40 s  instance 2 killed and restarted (FLT-6): its pre_kill record (read_ok) comes first, and
#         the refunds it still holds have a release but no final event, the unknown-time
#         credits of T-HFLT-4 ([acquire decision_ns, + receipt lifetime)).
# The seed (plan choice) gives instance 2, between 39 s and 40 s, six requests selected for the
# refusal after acquire: u000017 at 39.486 s, u000002 at 39.553 s and 39.623 s, u000012 at
# 39.856 s, u000007 at 39.876 s, and u000001 at 39.995 s, as the kill begins. Those admitted
# before the kill leave refunds without a final event. The run proves such unknown-time credits
# are counted under real faults, not that the verdict needs them: TestT_HFLT_4/binding
# (harness/e2e/hflt_test.go) shows a credit the verdict needs. Here none can bind, because the
# store pause comes before the kill:
#   - u000017, u000012 and u000007 never come near their bound: in no window do their arrivals
#     pass the 10/s refill by more than 8 tokens, and a bucket holds 20;
#   - zipf_s 1.1 gives u000000 to u000004 about 63, 29, 19, 14 and 11/s (the others 8.7/s and
#     less), but this seed's schedule gives u000004 9.6/s, and in no window do the arrivals of
#     u000004 to u000019 pass the refill by 20 tokens (u000004's come closest, 19.84), so only
#     u000000 to u000003 can reach their bound;
#   - they reach it only in windows that start at the run's start, from a full bucket, and end
#     before the pause. A window that reaches the credits either spans the pause, which leaves it
#     at least 25 tokens of slack (the bound counts 45 tokens of refill there, a bucket holds 20),
#     or starts after the pause began: the acquires sent in the pause's first
#     dependency_deadline run when the store resumes and take its refill with no decision
#     record, and the buckets stay drained after that, so such a window keeps most of a
#     capacity of slack.
name = "hflt4-faults"
seed = 9
run_kind = "test"
instances = 3

[api]
refuse_after_acquire_bp = 500

[[steps]]
rate_per_s = 200
duration_s = 60

[users]
count = 20

[[faults]]
at_s = 10
cmd = '{"target":"store","mode":"drop_reply","match":"refund","count":5}'
instance = 1

[[faults]]
at_s = 20
cmd = "faultctl store pause 4.5s"

[[faults]]
at_s = 39
cmd = '{"target":"store","mode":"delay","at":"after_reply","delay_ms":10000,"match":"refund"}'
instance = 2

[[faults]]
at_s = 40
cmd = "faultctl api kill 2 --restart"
