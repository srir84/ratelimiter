<style>
:root {

  --accent: #c2410c; --accent-soft: #fde5d5; --ring: #2563eb; --good: #15803d; --good-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
  --bad: #b91c1c; --repair: #8a8377; --async: #7c3aed; --data: #0f766e; --stream: #1d4ed8; --dep: #a8a29e; --sym: #1f5fa8;

}

  :root:not([data-theme="light"]) {
    --paper: #151417; --paper2: #1c1b1f; --card: #211f24; --ink: #ece8e1; --muted: #a8a196; --faint: #7a746b; --line: #38343d;
    --accent: #fb923c; --accent-soft: #3b2417; --ring: #60a5fa; --good: #4ade80; --good-soft: #13301f; --warn: #fbbf24; --warn-soft: #36290f;
    --bad: #f87171; --repair: #8f887d; --async: #a78bfa; --data: #2dd4bf; --stream: #60a5fa; --dep: #6b6660; --sym: #8cc0ff;
    --actor: #25284a; --actor-ink: #a5b4fc; --ui: #1e2a44; --ui-ink: #93c5fd; --entry: #2a2344; --entry-ink: #c4b5fd;
    --core: #3a3020; --core-ink: #fcd34d; --worker: #3a2618; --worker-ink: #fdba74; --store: #1c3325; --store-ink: #86efac;
    --channel: #3a1d2e; --channel-ink: #f9a8d4; --model: #133338; --model-ink: #67e8f9; --external: #262b33; --external-ink: #cbd5e1;
    --support: #2a2723; --support-ink: #d6d3d1;
  }
}
:root[data-theme="dark"] {
  --paper: #151417; --paper2: #1c1b1f; --card: #211f24; --ink: #ece8e1; --muted: #a8a196; --faint: #7a746b; --line: #38343d;
  --accent: #fb923c; --accent-soft: #3b2417; --ring: #60a5fa; --good: #4ade80; --good-soft: #13301f; --warn: #fbbf24; --warn-soft: #36290f;
  --bad: #f87171; --repair: #8f887d; --async: #a78bfa; --data: #2dd4bf; --stream: #60a5fa; --dep: #6b6660; --sym: #8cc0ff;
  --actor: #25284a; --actor-ink: #a5b4fc; --ui: #1e2a44; --ui-ink: #93c5fd; --entry: #2a2344; --entry-ink: #c4b5fd;
  --core: #3a3020; --core-ink: #fcd34d; --worker: #3a2618; --worker-ink: #fdba74; --store: #1c3325; --store-ink: #86efac;
  --channel: #3a1d2e; --channel-ink: #f9a8d4; --model: #133338; --model-ink: #67e8f9; --external: #262b33; --external-ink: #cbd5e1;
  --support: #2a2723; --support-ink: #d6d3d1;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 120px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--ui-face);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--faint); }
button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

header { padding: 26px 32px 6px; display: grid; grid-template-columns: 1fr auto; gap: 8px 28px; align-items: end; }
h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.015em; }
.standfirst { margin: 6px 0 0; font-family: var(--serif); font-size: 18px; color: var(--muted); max-width: 72ch; }
.stats { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 4px; align-items: center; }
.stats b { color: var(--ink); font-weight: 600; }
.langbar { display: inline-flex; width: 120px; height: 7px; border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: 6px; background: var(--line); }
.settings { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; justify-content: flex-end; }
.settings input[type=text] { width: 230px; font: 12px var(--mono); }

.story { position: relative; display: flex; justify-content: space-between; margin: 14px 32px 6px; padding: 0 20px; }
.story::before { content: ""; position: absolute; left: 44px; right: 44px; top: 17px; height: 4px; background: var(--accent); border-radius: 2px; opacity: .85; }
.stop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0;
  max-width: 150px; text-align: center; font-size: 13px; color: var(--ink); }
.stop .disc { width: 38px; height: 38px; border-radius: 50%; background: var(--paper); border: 4px solid var(--accent);
  display: grid; place-items: center; font-weight: 700; color: var(--accent); transition: background .15s, color .15s; }
.stop:hover .disc { background: var(--accent); color: var(--card); }

.dock { position: sticky; top: 0; z-index: 10; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 9px 32px;
  background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); font-size: 13px; }
.bar .spacer { flex: 1; }
.crumbs { display: flex; align-items: center; gap: 2px; font-weight: 600; flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 2px 4px; font-weight: 600; color: var(--sym); }
.crumbs button:disabled { color: var(--ink); opacity: 1; }
.crumbs .sep { color: var(--faint); }
.bar select { max-width: 260px; }
.find { position: relative; }
.find input { width: 230px; }
.results { position: absolute; right: 0; top: 34px; width: 380px; max-height: 360px; overflow: auto; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); display: none; padding: 4px; z-index: 30; }
.results.on { display: block; }
.results button { display: block; width: 100%; text-align: left; border: 0; border-radius: 7px; padding: 6px 8px; background: none; }
.results button:hover, .results button.sel { background: var(--paper2); }
.results .r1 { font: 12.5px var(--mono); color: var(--sym); }
.results .r2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; gap: 4px; align-items: center; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.new { background: var(--good-soft); color: var(--good); }
.pill.changed { background: var(--warn-soft); color: var(--warn); }

.tour { margin: 0 32px; padding: 10px 16px 12px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px;
  background: var(--card); display: none; box-shadow: 0 8px 20px rgb(0 0 0 / .06); }
.tour.on { display: block; }
.tour .proves { font-family: var(--serif); color: var(--muted); margin: 0 0 4px; font-size: 15px; }
.lanes { overflow-x: auto; }
.lanes svg { display: block; }
.lanes .lane-label { font: 11.5px var(--ui-face); fill: var(--muted); }
.lanes .lane-line { stroke: var(--line); stroke-width: 1; }
.lanes .hop { stroke: var(--faint); stroke-width: 1.6; fill: none; }
.lanes .hop.done { stroke: var(--accent); stroke-width: 2.2; }
.lanes circle.dot { fill: var(--card); stroke: var(--faint); stroke-width: 2; }
.lanes circle.dot.done { stroke: var(--accent); }
.lanes circle.dot.now { fill: var(--accent); stroke: var(--accent); }
.lanes .dot-num { font: 700 9.5px var(--ui-face); fill: var(--muted); text-anchor: middle; pointer-events: none; }
.lanes .dot-num.now { fill: #fff; }
.lanes .now-name { font: 12px var(--mono); fill: var(--accent); text-anchor: middle; }
.lanes .loop { stroke: var(--async); stroke-dasharray: 4 4; fill: none; stroke-width: 1.5; }
.lanes .loop-label { font: italic 11.5px var(--ui-face); fill: var(--async); }
.narration { font-family: var(--serif); font-size: 16.5px; margin: 6px 0 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.narration .where { font: 12px var(--mono); }

.changes { margin: 12px 32px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: none; }
.changes.on { display: block; }
.changes h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; }
.changes .rows { display: grid; grid-template-columns: minmax(150px, max-content) max-content 1fr; gap: 3px 16px; font-size: 13px; align-items: baseline; }
.changes .rows .who { font-weight: 600; cursor: pointer; }
.changes .rows .who:hover { text-decoration: underline; }
.num { font: 12px var(--mono); white-space: nowrap; }
.num .plus { color: var(--good); } .num .minus { color: var(--bad); }
.changes .what { color: var(--muted); font-size: 12.5px; }
.changes .what code { font: 12px var(--mono); color: var(--ink); }
.changes .gone { margin-top: 6px; font-size: 12.5px; color: var(--bad); }

.stage-wrap { overflow-x: auto; margin: 10px 0 0; padding: 0 32px; }
.stage { position: relative; width: max-content; min-width: 100%; }
.grid { display: flex; gap: var(--gx); padding: 26px calc(var(--gx) / 2) 30px; align-items: stretch; }
.col { width: var(--colw); flex: none; display: flex; flex-direction: column; justify-content: center; gap: var(--gy); }
.support { margin-top: 10px; padding: 16px 0 4px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 16px; }
.support > .label { width: 100%; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.support .card { flex: 0 1 300px; }
.card { position: relative; z-index: 2; background: var(--card); border: 1px solid var(--line); border-radius: 13px;
  padding: 12px 14px 10px; box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 3px 10px rgb(0 0 0 / .03);
  transition: opacity .18s, box-shadow .18s; cursor: pointer; }
.card::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--kind-ink); opacity: .6; }
.card:hover { box-shadow: 0 2px 4px rgb(0 0 0 / .06), 0 8px 22px rgb(0 0 0 / .09); }
.card.sel { box-shadow: 0 0 0 2px var(--ink); }
.card.ring { box-shadow: 0 0 0 3px var(--ring), 0 8px 22px rgb(0 0 0 / .1) !important; opacity: 1 !important; }
.card .top { display: flex; gap: 9px; align-items: flex-start; }
.icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--kind); color: var(--kind-ink); }
.icon svg { width: 18px; height: 18px; }
.role { font-weight: 650; font-size: 15.5px; line-height: 1.25; flex: 1; padding-top: 5px; }
.card .pill { margin-top: 5px; }
.purpose { font-family: var(--serif); margin: 7px 0 5px; font-size: 14.5px; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11.5px; color: var(--muted); align-items: center; }
.meta .tech { color: var(--kind-ink); font-weight: 600; }
.weight { height: 3px; border-radius: 2px; background: var(--kind-ink); opacity: .4; margin: 6px 0 3px; }
.group { margin-top: 6px; }
.group h4 { margin: 0 0 1px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.syms { display: flex; flex-wrap: wrap; gap: 1px 11px; }
a.sym { font: 12.5px var(--mono); color: var(--sym); text-decoration: none; border-radius: 4px; padding: 0 2px; position: relative; overflow-wrap: anywhere; }
a.sym:hover { text-decoration: underline; }
a.sym.lit { background: var(--accent); color: #fff; }
body.show-changes a.sym.new::after, body.show-changes a.sym.changed::after { content: ""; position: absolute; right: -5px; top: 1px; width: 6px; height: 6px; border-radius: 50%; }
body.show-changes a.sym.new::after { background: var(--good); }
body.show-changes a.sym.changed::after { background: var(--warn); }
.open-inside { margin-top: 8px; width: 100%; text-align: left; font-size: 12.5px; font-weight: 600; color: var(--kind-ink);
  background: var(--kind); border: 0; border-radius: 8px; padding: 5px 9px; display: flex; justify-content: space-between; }
.card.ghost { background: transparent; border-style: dashed; box-shadow: none; padding: 8px 12px; opacity: .85; }
.card.ghost::before { display: none; }
.card.ghost .role { font-size: 13.5px; padding-top: 0; }
.card.ghost .where-note { font-size: 11px; color: var(--muted); }
body.compact .group, body.compact .purpose { display: none; }
body.show-changes .card.unchanged:not(.ghost) { opacity: .55; }
body.show-changes .card.cnew { box-shadow: 0 0 0 2px var(--good), 0 6px 18px rgb(21 128 61 / .15); }
body.show-changes .card.cchanged { box-shadow: 0 0 0 2px var(--warn), 0 6px 18px rgb(180 83 9 / .12); }
.card .pill.cp { display: none; }
body.show-changes .card .pill.cp { display: inline-flex; }
.card.dim { opacity: .25 !important; }
a.sym.dim { opacity: .25; }

svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
svg.wires path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: help; }
svg.wires path.w { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; transition: opacity .18s; }
svg.wires path.w.main { stroke: var(--accent); stroke-width: 2.6; }
svg.wires path.w.async { stroke: var(--async); stroke-dasharray: 1 6; stroke-width: 2.6; }
svg.wires path.w.read, svg.wires path.w.write { stroke: var(--data); stroke-width: 1.9; }
svg.wires path.w.stream { stroke: var(--stream); stroke-dasharray: 10 3 2 3; stroke-width: 2.2; }
svg.wires path.w.depends { stroke: var(--dep); stroke-width: 1.3; }
svg.wires path.w.repair { stroke: var(--repair); stroke-dasharray: 6 5; stroke-width: 1.7; }
svg.wires path.w.dep { stroke: var(--dep); stroke-dasharray: 2 4; stroke-width: 1.4; }
svg.wires path.w.dep.undrawn { stroke: var(--warn); stroke-width: 1.7; }
svg.wires path.w.dep.bad { stroke: var(--bad); stroke-width: 2; }
svg.wires path.w.newwire { filter: drop-shadow(0 0 3px var(--good)); }
svg.wires .badge circle { fill: var(--accent); }
svg.wires .badge text { fill: #fff; font: 700 11.5px var(--ui-face); text-anchor: middle; dominant-baseline: central; }
svg.wires .lbl { font: 12px var(--ui-face); fill: var(--muted); paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }
svg.wires .lbl.main { fill: var(--ink); }
svg.wires .lbl.repair { font-style: italic; }
svg.wires .lbl.dep { font: 11px var(--mono); fill: var(--warn); }
svg.wires g.hidden { display: none; }
svg.wires g.faded { opacity: .1; }
svg.wires g.quiet { opacity: .38; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 32px 0; font-size: 12px; color: var(--muted); align-items: center; }
.legend svg { vertical-align: middle; margin-right: 5px; }
.legend .sw, .legend .kind { display: inline-flex; align-items: center; gap: 5px; }
.legend .kind i { width: 12px; height: 12px; border-radius: 3px; background: var(--kind); border: 1.5px solid var(--kind-ink); display: inline-block; }

.lifecycles { margin: 26px 32px 0; }
.lifecycles h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.lc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; overflow-x: auto; }
.lc .lc-title { font-weight: 650; }
.lc .lc-card { font-size: 12.5px; color: var(--muted); margin-left: 8px; cursor: pointer; }
.lc .lc-card:hover { text-decoration: underline; }
.lc svg { display: block; margin-top: 4px; overflow: visible; }
.lc svg .st rect { fill: var(--paper2); stroke: var(--line); }
.lc svg .st text { font: 600 12.5px var(--ui-face); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.lc svg .tr { fill: none; stroke: var(--faint); stroke-width: 1.5; }
.lc svg .tl { font: 11.5px var(--ui-face); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
.lc svg .tl.link { fill: var(--sym); cursor: pointer; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 94vw); background: var(--card); border-left: 1px solid var(--line);
  box-shadow: -16px 0 40px rgb(0 0 0 / .12); z-index: 40; transform: translateX(105%); transition: transform .22s ease; overflow-y: auto; padding: 18px 20px 30px; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
.drawer .close { position: absolute; right: 14px; top: 14px; }
.drawer h2 { margin: 0 34px 2px 0; font-size: 20px; }
.drawer .kindline { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.drawer .purpose { font-size: 16px; }
.drawer .why { font-family: var(--serif); font-style: italic; color: var(--muted); margin: 0 0 8px; }
.drawer h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 5px; }
.drawer ul { list-style: none; margin: 0; padding: 0; }
.drawer li { padding: 4px 0; font-size: 13px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.drawer li .doc { color: var(--muted); font-size: 12.5px; display: block; }
.drawer li .n { float: right; font: 11.5px var(--mono); color: var(--muted); margin-left: 8px; }
.drawer .f { font: 12px var(--mono); }
.drawer .ev { display: block; font-size: 11px; color: var(--faint); }
.drawer .ev a.sym { font-size: 11px; }
.linky { color: var(--sym); cursor: pointer; }
.linky:hover { text-decoration: underline; }

#tip { position: fixed; z-index: 50; max-width: 440px; pointer-events: none; background: var(--ink); color: var(--paper);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: none; box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
#tip b { font-family: var(--mono); font-weight: 600; }
#tip .where { font: 11px var(--mono); opacity: .7; margin-top: 4px; }
footer { margin: 30px 32px 40px; font-size: 12px; color: var(--muted); line-height: 1.8; }
footer code { font-family: var(--mono); }
.hint { color: var(--muted); font-size: 12px; }
@media (max-width: 900px) {
  header, .story, .tour, .changes, .legend, .lifecycles, footer { margin-left: 16px; margin-right: 16px; }
  header { padding-left: 0; padding-right: 0; grid-template-columns: 1fr; }
  .bar { padding: 8px 16px; } .stage-wrap { padding: 0 16px; }
  .story { overflow-x: auto; gap: 12px; justify-content: flex-start; padding: 0; } .story::before { display: none; }
  .settings { justify-content: flex-start; } .settings input[type=text] { width: 180px; } .find input { width: 170px; } .results { width: min(340px, 90vw); }
}
</style>
</head>
<body>
<header>
  <div><h1 id="title"></h1><p class="standfirst" id="summary"></p></div>
  <div class="settings">
    <label>Open in <select id="scheme"><option value="vscode">VS Code</option><option value="cursor">Cursor</option><option value="copy">copy path:line</option></select></label>
    <label>Repo root <input type="text" id="root" placeholder="/path/to/repo" spellcheck="false"></label>
  </div>
  <div class="stats" id="stats"></div>
</header>
<nav class="story" id="story" aria-label="What happens, end to end"></nav>
<div class="dock">
  <div class="bar">
    <nav class="crumbs" id="crumbs" aria-label="Level"></nav>
    <span class="spacer"></span>
    <label>Journey <select id="journey"><option value="">— pick a story —</option></select></label>
    <button id="prev" title="Previous step (←)" aria-label="Previous step">←</button><button id="next" title="Next step (→)" aria-label="Next step">→</button>
    <button id="changes" aria-pressed="false" title="What changed (c)">Changes</button>
    <button id="deps" aria-pressed="false" title="Real imports between cards (d)">Code links</button>

      if (r.top < dock.bottom + 10 || r.bottom > innerHeight - 10) scrollTo({ top: Math.max(0, scrollY + r.top - dock.bottom - 30), behavior: "smooth" }); }
  }
  function lanes() {
    const box = $("lanes"); box.replaceChildren();
    const leaf = (s) => s.card || s.path, leaves = new Set(J.steps.map(leaf));
    // many parts: one lane per top-level part (usually one per process or service); the dot's name says which part
    const key = leaves.size > 6 ? (s) => (s.card && C[s.card] ? chain(s.card)[0] : s.path) : leaf, ids = [];
    J.steps.forEach((s) => { if (!ids.includes(key(s))) ids.push(key(s)); });
    const name = (k) => C[k]?.role || k.split("/").pop();
    const lh = ids.length > 5 ? 17 : 22, lw = Math.min(210, Math.max(...ids.map((k) => name(k).length)) * 6.4 + 18);
    const sx = Math.max(56, Math.min(120, (box.clientWidth - lw - 30) / Math.max(1, J.steps.length)));
    const W = lw + sx * J.steps.length + 20, H = 30 + (ids.length - 1) * lh + 12 + (J.loop ? 22 : 0);
    const svg = sv("svg", { width: W, height: H, role: "img", "aria-label": "The journey as swimlanes: one row per part, one dot per step" });
    ids.forEach((k, i) => { const y = 30 + i * lh; svg.append(sv("line", { x1: lw, x2: W - 6, y1: y, y2: y, class: "lane-line" }));
      const t = sv("text", { x: lw - 10, y: y + 4, class: "lane-label", "text-anchor": "end" }); t.textContent = name(k); svg.append(t); });
    const pt = (i) => [lw + sx * i + sx / 2, 30 + ids.indexOf(key(J.steps[i])) * lh];
    for (let i = 1; i < J.steps.length; i++) { const [x0, y0] = pt(i - 1), [x1, y1] = pt(i);
      svg.append(sv("path", { d: `M${x0},${y0} C${(x0 + x1) / 2},${y0} ${(x0 + x1) / 2},${y1} ${x1},${y1}`, class: "hop" + (i <= at ? " done" : "") })); }
    if (J.loop) { const [f, t, text] = J.loop, [x0] = pt(f - 1), [x1] = pt(t - 1), yb = H - 8, ya = 30 + (ids.length - 1) * lh + 10;
      svg.append(sv("path", { d: `M${x0},${ya} C${x0},${yb} ${x1},${yb} ${x1},${ya}`, class: "loop" }));
      const lt = sv("text", { x: (x0 + x1) / 2, y: yb + 2, class: "loop-label", "text-anchor": "middle" }); lt.textContent = "↺ " + text; svg.append(lt); }
    J.steps.forEach((s, i) => { const [x, y] = pt(i), g = sv("g", { style: "cursor:pointer" });
      g.append(sv("circle", { cx: x, cy: y, r: i === at ? 9.5 : 7.5, class: "dot" + (i < at ? " done" : "") + (i === at ? " now" : "") }));
      const n = sv("text", { x, y: y + 3.5, class: "dot-num" + (i === at ? " now" : "") }); n.textContent = i + 1; g.append(n);
      const title = sv("title"); title.textContent = `${i + 1}. ${nameOf(s)}${s.card && C[s.card] ? " (" + C[s.card].role + ")" : ""}: ${s.text}`; g.append(title);
      g.addEventListener("click", () => { at = i; tour(true); }); svg.append(g);
      if (i === at) { const nm = sv("text", { x: Math.max(lw + 60, Math.min(W - 80, x)), y: 13, class: "now-name" }); const nmText = nameOf(s) + (key !== leaf && s.card && C[s.card] ? ` · ${C[s.card].role}` : "");
        nm.textContent = nmText.length > 48 ? nmText.slice(0, 47) + "…" : nmText; svg.append(nm); } });
    box.append(svg);
  }

  // ------------------------------------------------------------ lifecycles
  function lifecycles() {
    const sec = $("lifecycles"); sec.replaceChildren();
    if (!M.lifecycles.length) return;
    sec.append(el("h2", {}, "Lifecycles"));
    const faint = getComputedStyle(document.documentElement).getPropertyValue("--faint").trim();
    M.lifecycles.forEach((l, n) => {
      const box = el("div", { class: "lc" }, el("span", { class: "lc-title" }, l.title),
        l.card && C[l.card] ? el("span", { class: "lc-card", onclick: () => { go(levelOf(l.card)); setTimeout(() => focusCard(l.card), 80); } }, `· ${C[l.card].role}`) : null);
      const svg = sv("svg"); box.append(svg); sec.append(box);  // on the page before it is sized, so its words can be measured
      const probe = sv("text", { class: "tl" }), name = sv("text"), pill = sv("g", { class: "st" }); pill.append(name); svg.append(probe, pill);
      const measure = (e, s) => { e.textContent = s; return e.getComputedTextLength?.() || 0; };  // 0 where it cannot be measured
      const real = new Map(l.transitions.map((t) => [t, measure(probe, t.label)])), named = l.states.map((x) => measure(name, x)); probe.remove(); pill.remove();
      // a label's or a state's length as drawn where the browser measures it, never under the page's estimate (6.4 and 7.6 px a character)
      const wide = (t) => Math.max(t.label.length * 6.4, real.get(t));
      const sw = Math.max(104, Math.max(...l.states.map((x, i) => Math.max(x.length * 7.6, named[i]))) + 30), gap = Math.max(70, Math.max(0, ...l.transitions.filter((t) => Math.abs(l.states.indexOf(t.to) - l.states.indexOf(t.from)) === 1).map(wide)) + 18);
      const idx = Object.fromEntries(l.states.map((x, i) => [x, i]));
      const fwd = l.transitions.filter((t) => idx[t.to] - idx[t.from] === 1), over = l.transitions.filter((t) => idx[t.to] - idx[t.from] > 1),
        back = l.transitions.filter((t) => idx[t.to] <= idx[t.from]);
      const step = 22, up = 26 + over.length * step, cy = up + 18, H = cy + 22 + back.length * step + 16;
      // a label sits centred between its two states, a self-loop's under its state: the margins grow to hold the widest at either end
      const mid = (t) => (idx[t.from] + idx[t.to]) / 2 * (sw + gap) + sw / 2, half = (t) => wide(t) / 2 + 2, right = l.states.length * (sw + gap) - gap;
      const ml = 10 + Math.ceil(Math.max(0, ...l.transitions.map((t) => half(t) - mid(t) - 10)));
      const W = l.states.length * (sw + gap) - gap + 20 + (ml - 10) + Math.ceil(Math.max(0, ...l.transitions.map((t) => mid(t) + half(t) - right - 10)));
      for (const [k, v] of Object.entries({ width: W, height: H, viewBox: `0 0 ${W} ${H}`, "data-w": W, "data-h": H })) svg.setAttribute(k, v);
      const defs = sv("defs"), mk = sv("marker", { id: `lc-arrow-${n}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" });
      mk.append(sv("path", { d: "M0,1 L10,5 L0,9 z", fill: faint })); defs.append(mk); svg.append(defs);
      const cx = (i) => ml + i * (sw + gap) + sw / 2, arrow = `url(#lc-arrow-${n})`, labels = [];
      const text = (x, y, t) => { const e = sv("text", { x, y, class: "tl" + (t.sym ? " link" : "") }); e.textContent = t.label;
        if (t.sym) { e.addEventListener("click", (ev) => { if (ev.altKey || $("scheme").value === "copy" || !$("root").value) copy(where(t.sym)); else location.href = href(t.sym); });
          e.addEventListener("mouseenter", (ev) => tip(ev, t.sym)); e.addEventListener("mousemove", move); e.addEventListener("mouseleave", untip); }
        labels.push(e); };
      // longer jumps ride higher above (and below, going back), so arcs and their labels never share a height
      over.sort((p, q) => (idx[p.to] - idx[p.from]) - (idx[q.to] - idx[q.from])).forEach((t, k) => { const a = idx[t.from], b = idx[t.to], h = cy - 18 - 14 - k * step;
        svg.append(sv("path", { d: `M${cx(a) + 10},${cy - 18} L${cx(a) + 10},${h + 6} Q${cx(a) + 10},${h} ${cx(a) + 16},${h} L${cx(b) - 16},${h} Q${cx(b) - 10},${h} ${cx(b) - 10},${h + 6} L${cx(b) - 10},${cy - 19}`, class: "tr", "marker-end": arrow }));
        text((cx(a) + cx(b)) / 2, h - 4, t); });
      back.sort((p, q) => (idx[p.from] - idx[p.to]) - (idx[q.from] - idx[q.to])).forEach((t, k) => { const a = idx[t.from], b = idx[t.to], h = cy + 18 + 16 + k * step;
        const x1 = cx(a) - 10, x2 = a === b ? cx(a) + 10 : cx(b) + 10;
        svg.append(sv("path", { d: `M${x1},${cy + 18} L${x1},${h - 6} Q${x1},${h} ${x1 - 6},${h} L${x2 + 6},${h} Q${x2},${h} ${x2},${h - 6} L${x2},${cy + 19}`, class: "tr", "marker-end": arrow }));
        text((x1 + x2) / 2, h + 13, t); });
      l.states.forEach((x, i) => { const g = sv("g", { class: "st" }); g.append(sv("rect", { x: cx(i) - sw / 2, y: cy - 18, width: sw, height: 36, rx: 18 }));
        const t = sv("text", { x: cx(i), y: cy }); t.textContent = x; g.append(t); svg.append(g); });
      fwd.forEach((t) => { const a = idx[t.from], b = idx[t.to];
        svg.append(sv("path", { d: `M${cx(a) + sw / 2},${cy} L${cx(b) - sw / 2 - 1},${cy}`, class: "tr", "marker-end": arrow })); text((cx(a) + cx(b)) / 2, cy - 7, t); });
      svg.append(...labels); });  // after every arc, so a label's halo hides the arcs that cross it
    fitLifecycles();
  }
  function fitLifecycles(shrinkOnly) {  // shrink a lifecycle wider than its box (up to 30%) so it fits, as fitZoom does a level
    $("lifecycles").querySelectorAll("svg").forEach((s) => { const box = s.parentNode, pad = getComputedStyle(box), W = +s.getAttribute("data-w"), H = +s.getAttribute("data-h");
      const avail = box.clientWidth - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight), z = W > avail ? Math.max(0.7, avail / W) : 1;
      if (!shrinkOnly || W * z < +s.getAttribute("width")) { s.setAttribute("width", W * z); s.setAttribute("height", H * z); } });
  }

  // ------------------------------------------------------------ story strip
  M.story.forEach((s, i) => $("story").append(el("button", { class: "stop", onclick: () => { go(levelOf(s.card)); setTimeout(() => focusCard(s.card), 80); } },
    el("span", { class: "disc" }, String(i + 1)), el("span", {}, (s.icon ? s.icon + " " : "") + s.label))));
  if (!M.story.length) $("story").style.display = "none";

  // ------------------------------------------------------------ find, across every level
  const index = [];
  for (const id of M.order) { const c = C[id];
    index.push({ kind: "card", id, text: `${c.role} ${c.purpose} ${c.files.join(" ")}`.toLowerCase(), title: c.role, sub: c.purpose });
    c.groups.forEach((g) => g.symbols.forEach((s) => index.push({ kind: "sym", id, s, text: `${nameOf(s)} ${s.doc} ${s.path}`.toLowerCase(), title: nameOf(s), sub: `${c.role} · ${s.path}:${s.line}` })));  // found by the name it shows
    c.owned.forEach((f) => index.push({ kind: "file", id, text: f.path.toLowerCase(), title: f.path, sub: c.role })); }
  let hits = [], sel = 0;
  function applyFind() {
    const q = $("find").value.trim().toLowerCase();
    document.querySelectorAll("#grid a.sym, #support a.sym").forEach((a) => a.classList.toggle("dim", !!q && !`${nameOf(a._sym)} ${a._sym.doc} ${a._sym.path}`.toLowerCase().includes(q)));
    const res = $("results"); res.replaceChildren(); hits = q ? index.filter((x) => x.text.includes(q)).slice(0, 40) : []; sel = 0;
    hits.forEach((h, i) => res.append(el("button", { class: i === sel ? "sel" : "", onmousedown: (e) => { e.preventDefault(); pick(h); } },
      el("div", { class: "r1" }, (h.kind === "card" ? "▣ " : h.kind === "file" ? "▤ " : "") + h.title), el("div", { class: "r2" }, h.sub))));
    res.classList.toggle("on", !!q && document.activeElement === $("find"));
    if (q) $("count").textContent = `${hits.length}${hits.length === 40 ? "+" : ""} found`; else if (/found$/.test($("count").textContent)) $("count").textContent = "";
  }
  function pick(h) { $("results").classList.remove("on"); $("find").blur(); go(levelOf(h.id));
    setTimeout(() => { focusCard(h.id); if (h.kind === "sym") { const a = [...document.querySelectorAll("#grid a.sym, #support a.sym")].find((x) => x._sym.ref === h.s.ref);
      if (a) { a.classList.add("lit"); setTimeout(() => a.classList.remove("lit"), 1800); } } else openDrawer(h.id); }, 80); }
  $("find").addEventListener("input", applyFind);
  $("find").addEventListener("focus", applyFind);
  $("find").addEventListener("blur", () => setTimeout(() => $("results").classList.remove("on"), 150));
  $("find").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, Math.min(hits.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
      [...$("results").children].forEach((b, i) => b.classList.toggle("sel", i === sel)); $("results").children[sel]?.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter" && hits[sel]) pick(hits[sel]);
    if (e.key === "Escape") { $("find").value = ""; applyFind(); $("find").blur(); } });

  // ------------------------------------------------------------ keys, footer, start
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey) return;
    if (e.key === "ArrowRight" && J) { step(1); e.preventDefault(); } else if (e.key === "ArrowLeft" && J) { step(-1); e.preventDefault(); }
    else if (e.key === "Escape") { if (selected) closeDrawer(); else if (J) { $("journey").value = ""; J = null; tour(false); } }
    else if (e.key === "/") { e.preventDefault(); $("find").focus(); }
    else if (e.key === "c" && CH) toggles.changes(!showChanges); else if (e.key === "d") toggles.deps(!showDeps); else if (e.key === "r") toggles.repairs(!showRepairs);
    else if ((e.key === "Backspace" || e.key === "u") && level) { e.preventDefault(); go(C[level].parent || ""); } });
  const gr = M.grounding;
  $("footer").append(el("div", {}, `Built ${meta.built} from commit `, el("code", {}, meta.commit + (meta.dirty ? " + uncommitted changes" : "")),
      ` · ${M.anchors} names checked against the source · ${gr.mapped_files} of ${gr.source_files} source files on a card`),
    el("div", {}, `${gr.wires} links: ${gr.imports} match imports in the code, ${gr.via} name their call site, ${gr.declared} cross a process boundary or touch no code`,
      gr.undrawn ? el("span", {}, " · ", el("span", { class: "linky", onclick: () => toggles.deps(true) }, `${gr.undrawn} real import link${gr.undrawn > 1 ? "s" : ""} not drawn: show`)) : null),
    el("div", {}, "Refresh: ", el("code", {}, "python3 ~/.agents/templates/code_map.py build")));
  if (store.get("codemap.compact") === "1") toggles.compact(true);
  changesPanel(); lifecycles();
  const hashLevel = decodeURIComponent((location.hash.match(/level=([^&]+)/) || [])[1] || "");
  if (hashLevel && M.levels[hashLevel]) level = hashLevel;
  render();
  if (CH && (CH.totals.files || CH.removed_cards.length) && store.get("codemap.changes") !== "0") setChanges(true);
  addEventListener("resize", () => { fitColumns(L()); fitZoom(); fitLifecycles(); drawSoon(); });
  document.fonts?.ready.then(drawSoon);
  if (window.ResizeObserver) { new ResizeObserver(drawSoon).observe($("grid"));
    // a classic scrollbar that comes with the drawn map narrows the lifecycles' box, and no resize says so: fit them again, a frame
    // later and only narrower, so a scrollbar their shrinking takes away cannot bring them back and forth (a resize fits either way)
    new ResizeObserver(() => requestAnimationFrame(() => fitLifecycles(true))).observe($("lifecycles")); }
})();
</script>
