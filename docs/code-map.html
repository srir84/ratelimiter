<!doctype html>
<html lang="en">
<head>

<title>Distributed token-bucket rate limiter · code map</title>
<style>
:root {
  --paper: #f6f3ec; --paper2: #efeae0; --card: #fffdf8; --ink: #1f1d1a; --muted: #6b655b; --faint: #9a9387; --line: #ddd5c6;
  --accent: #c2410c; --accent-soft: #fde5d5; --ring: #2563eb; --good: #15803d; --good-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
  --bad: #b91c1c; --repair: #8a8377; --async: #7c3aed; --data: #0f766e; --stream: #1d4ed8; --dep: #a8a29e; --sym: #1f5fa8;
  --actor: #e0e7ff; --actor-ink: #4338ca; --ui: #dbeafe; --ui-ink: #1d4ed8; --entry: #ede9fe; --entry-ink: #6d28d9;
  --core: #fef3c7; --core-ink: #a16207; --worker: #ffedd5; --worker-ink: #c2410c; --store: #dcfce7; --store-ink: #15803d;
  --channel: #fce7f3; --channel-ink: #be185d; --model: #cffafe; --model-ink: #0e7490; --external: #eef2f6; --external-ink: #475569;
  --support: #f1ede6; --support-ink: #78716c;
  --ui-face: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
  --mono: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --colw: 260px; --gx: 104px; --gy: 34px; --hdr: 56px; --sticky: 220px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151417; --paper2: #1c1b1f; --card: #211f24; --ink: #ece8e1; --muted: #a8a196; --faint: #7a746b; --line: #38343d;
    --accent: #fb923c; --accent-soft: #3b2417; --ring: #60a5fa; --good: #4ade80; --good-soft: #13301f; --warn: #fbbf24; --warn-soft: #36290f;
    --bad: #f87171; --repair: #8f887d; --async: #a78bfa; --data: #2dd4bf; --stream: #60a5fa; --dep: #6b6660; --sym: #8cc0ff;
    --actor: #25284a; --actor-ink: #a5b4fc; --ui: #1e2a44; --ui-ink: #93c5fd; --entry: #2a2344; --entry-ink: #c4b5fd;
    --core: #3a3020; --core-ink: #fcd34d; --worker: #3a2618; --worker-ink: #fdba74; --store: #1c3325; --store-ink: #86efac;
    --channel: #3a1d2e; --channel-ink: #f9a8d4; --model: #133338; --model-ink: #67e8f9; --external: #262b33; --external-ink: #cbd5e1;
    --support: #2a2723; --support-ink: #d6d3d1;
  }
}
:root[data-theme="dark"] {
  --paper: #151417; --paper2: #1c1b1f; --card: #211f24; --ink: #ece8e1; --muted: #a8a196; --faint: #7a746b; --line: #38343d;
  --accent: #fb923c; --accent-soft: #3b2417; --ring: #60a5fa; --good: #4ade80; --good-soft: #13301f; --warn: #fbbf24; --warn-soft: #36290f;
  --bad: #f87171; --repair: #8f887d; --async: #a78bfa; --data: #2dd4bf; --stream: #60a5fa; --dep: #6b6660; --sym: #8cc0ff;
  --actor: #25284a; --actor-ink: #a5b4fc; --ui: #1e2a44; --ui-ink: #93c5fd; --entry: #2a2344; --entry-ink: #c4b5fd;
  --core: #3a3020; --core-ink: #fcd34d; --worker: #3a2618; --worker-ink: #fdba74; --store: #1c3325; --store-ink: #86efac;
  --channel: #3a1d2e; --channel-ink: #f9a8d4; --model: #133338; --model-ink: #67e8f9; --external: #262b33; --external-ink: #cbd5e1;
  --support: #2a2723; --support-ink: #d6d3d1;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--hdr) + 16px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--ui-face);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--faint); }
button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, svg [tabindex]:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
code { font-family: var(--mono); }
.hint { color: var(--muted); font-size: 13px; }
.linky { border: 0; background: none; padding: 0; color: var(--sym); font: inherit; text-align: left; cursor: pointer; }
.linky:hover { text-decoration: underline; }
.sec-title { margin: 30px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
.icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--kind); color: var(--kind-ink); }
.icon svg { width: 18px; height: 18px; }
.pill { display: inline-flex; gap: 4px; align-items: center; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.new { background: var(--good-soft); color: var(--good); }
.pill.changed { background: var(--warn-soft); color: var(--warn); }
a.sym { font: 12.5px var(--mono); color: var(--sym); text-decoration: none; border-radius: 4px; padding: 0 2px; position: relative; overflow-wrap: anywhere; }
a.sym:hover { text-decoration: underline; }
a.sym.lit { background: var(--accent); color: #fff; }

/* the header: title, where you are, Paths, Find, More */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 32px;
  background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; flex: 1 1 300px; min-width: 0; }
.brand h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.brand h1 a { color: inherit; text-decoration: none; }
.brand h1 a:hover { text-decoration: underline; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; font-size: 13.5px; min-width: 0; }
.crumbs button { border: 0; background: none; padding: 2px 4px; color: var(--sym); font-weight: 600; }
.crumbs button:hover { text-decoration: underline; }
.crumbs .here { padding: 2px 4px; font-weight: 600; }
.crumbs .sep { color: var(--faint); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; }
.menu { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); width: 300px; max-height: min(72vh, 600px); overflow: auto; padding: 6px; z-index: 40;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); display: none; }
.pop.on { display: block; }
.pop button { display: block; width: 100%; text-align: left; border: 0; border-radius: 7px; padding: 7px 9px; background: none; }
.pop button:hover:not(:disabled) { background: var(--paper2); }
.pop button[aria-pressed] { position: relative; padding-right: 40px; }
.pop button[aria-pressed]::after { content: "off"; position: absolute; right: 9px; top: 8px; font-size: 12px; color: var(--muted); }
.pop button[aria-pressed=true] { background: var(--accent-soft); }
.pop button[aria-pressed=true]::after { content: "on"; color: var(--accent); font-weight: 650; }
.pop .sub { display: block; font-size: 12.5px; color: var(--muted); }
.pop .group { padding: 9px 9px 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 2px; }
.pop label { display: flex; flex-direction: column; gap: 3px; padding: 6px 9px; font-size: 12.5px; color: var(--muted); }
.pop select, .pop input[type=text] { width: 100%; }
.pop input[type=text] { font: 12px var(--mono); }
.find { position: relative; }
.find input { width: 250px; }
.results { position: absolute; right: 0; top: 36px; width: 430px; max-height: 440px; overflow: auto; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); display: none; padding: 4px; z-index: 40; }
.results.on { display: block; }
.results .rgroup { padding: 8px 8px 3px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.results button { display: block; width: 100%; text-align: left; border: 0; border-radius: 7px; padding: 6px 8px; background: none; }
.results button:hover, .results button.sel { background: var(--paper2); }
.results .r1 { font: 12.5px var(--mono); color: var(--sym); overflow-wrap: anywhere; }
.results .r1.say { font: 13.5px/1.35 var(--ui-face); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.results .r1.path { font: 650 14px/1.35 var(--ui-face); color: var(--ink); }
.results .r1.part { font: 600 14px/1.35 var(--ui-face); color: var(--ink); }
.results .r2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font-size: 12px; color: var(--muted); }

/* the overview: the spine, its branches and frames, the chapters, then the rest */
.view-pad { padding: 18px 32px 36px; }
.standfirst { margin: 2px 0 20px; font-family: var(--serif); font-size: 18px; color: var(--muted); max-width: 74ch; }
.ov-stage { position: relative; }
.ov-stage.framed { padding-top: 32px; }
.ov-grid { display: grid; column-gap: 40px; row-gap: 46px; align-items: stretch; }
.box { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; background: var(--card);
  border: 1px solid var(--line); border-radius: 13px; padding: 11px 12px 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 3px 10px rgb(0 0 0 / .03);
  transition: box-shadow .15s; }
.box::before, .tile::before, .card::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--kind-ink); opacity: .6; }
.box:hover { border-color: var(--line); box-shadow: 0 2px 4px rgb(0 0 0 / .06), 0 8px 22px rgb(0 0 0 / .09); }
.box-top { display: flex; gap: 8px; align-items: flex-start; }
.box .icon { width: 26px; height: 26px; border-radius: 7px; }
.box .icon svg { width: 16px; height: 16px; }
.box .role { font-weight: 650; font-size: 15px; line-height: 1.25; padding-top: 3px; overflow-wrap: anywhere; }
.box .job { font-family: var(--serif); font-size: 14px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
.box.near { box-shadow: 0 0 0 2px var(--ring), 0 6px 18px rgb(0 0 0 / .08); }
.box.lit { box-shadow: 0 0 0 3px var(--accent), 0 8px 22px rgb(0 0 0 / .1); }
.frame { position: absolute; z-index: 0; pointer-events: none; border: 1.5px dashed color-mix(in srgb, var(--faint) 80%, transparent); border-radius: 16px;
  background: color-mix(in srgb, var(--paper2) 85%, transparent); }
.frame.near { border: 1.5px solid var(--ring); }
.ov-stage > .flabel { position: absolute; z-index: 3; pointer-events: none; padding: 1px 6px; border-radius: 6px; font-size: 13px; font-weight: 650; color: var(--muted);
  background: color-mix(in srgb, var(--paper2) 85%, var(--paper)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
svg.ov-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
svg.ov-wires .line { fill: none; stroke: var(--muted); stroke-width: 1.8; }
svg.ov-wires .edge.lit .line { stroke: var(--accent); stroke-width: 2.6; }
svg.ov-wires .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: help; }
svg.ov-wires .edge:focus { outline: none; }
svg.ov-wires .edge:focus-visible .line { stroke: var(--ring); stroke-width: 3; }
.ov-info { margin: 14px 0 0; min-height: calc(2 * 1.45em); font-size: 14px; line-height: 1.45; color: var(--muted); max-width: 120ch; }
.ov-info b { color: var(--ink); font-weight: 650; }
.ov-info .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 650; color: var(--muted); }
.also { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; font-size: 13.5px; }
.also .label { color: var(--muted); font-weight: 650; margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 11px; font-size: 13.5px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.chip:hover { border-color: var(--faint); }
.ov-cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 52px; margin-top: 6px; align-items: start; }
.flow-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 30px 0 10px; }
.flow-head .sec-title { margin: 0; }
.flow-of { margin: -6px 0 8px; font-size: 13.5px; color: var(--muted); }
.chaps { list-style: none; margin: 0; padding: 0; max-width: 660px; }
.chap { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none;
  padding: 6px 8px; border-radius: 9px; }
.chap:hover, .chap.lit { background: var(--accent-soft); }
.chap .num { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--accent); color: var(--accent); background: var(--paper); display: grid; place-items: center;
  font-weight: 700; font-size: 13.5px; }
.chap:hover .num, .chap.lit .num { background: var(--accent); color: var(--card); }
.chap .clabel { font-family: var(--serif); font-size: 16.5px; line-height: 1.3; }
.chap .cbox { font-size: 13px; color: var(--muted); text-align: right; }
.walk { background: var(--accent); color: #fff; border-color: var(--accent); border-radius: 999px; padding: 5px 14px; font-weight: 650; font-size: 14px; }
.walk:hover { border-color: var(--ink); }
.pathbtns { display: grid; gap: 8px; }
.pathbtn { display: grid; gap: 2px; text-align: left; padding: 9px 12px; border-radius: 11px; }
.pathbtn .ptitle { font-weight: 650; }
.pathbtn .psub { font-family: var(--serif); font-size: 14px; color: var(--muted); }
.pathbtn .psteps { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--faint); }
.pathbtn .follow { color: var(--sym); font-weight: 650; }
.pathbtn:hover .follow { text-decoration: underline; }
.sec-title .share { text-transform: none; letter-spacing: 0; font-weight: 500; }
.terms { margin: 0; display: grid; gap: 7px; }
.term { font-size: 14.5px; line-height: 1.4; }
.term dt { display: inline; font-weight: 650; }
.term dt::after { content: " · "; color: var(--faint); font-weight: 400; }
.term dd { display: inline; margin: 0; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 5px; text-align: left; padding: 10px 12px; border-radius: 11px; }
.tile .top { display: flex; gap: 8px; align-items: center; }
.tile .icon { width: 24px; height: 24px; border-radius: 7px; }
.tile .icon svg { width: 15px; height: 15px; }
.tile .role { font-weight: 650; }
.tile .job { font-size: 13.5px; color: var(--muted); }
.tile .lines { margin-top: auto; font-size: 12px; color: var(--faint); }
.toolsrow .tiles { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.toolsrow .pathbtns { margin-top: 10px; }

/* the path view: sentences in chapters under a mini-map that lights where each step sits */
.pv { padding: 0 32px 44px; }
.pv-head { position: sticky; top: var(--hdr); z-index: 20; padding: 14px 0 10px; background: var(--paper); border-bottom: 1px solid var(--line); }
.pv-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.pv-title h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.pv-ctrl { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
.stepcount { min-width: 196px; text-align: center; color: var(--muted); white-space: nowrap; }
.mapbtn { min-width: 86px; }
.pv-head.nomap .mm, .pv-head.nomap .mm-legend { display: none; }
.proves { margin: 12px 0 0; font-family: var(--serif); font-size: 15.5px; color: var(--muted); max-width: 92ch; }
.proves b { font-family: var(--ui-face); font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
.mm { position: relative; margin-top: 2px; padding: 8px 2px 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.mm.lows { padding-top: 24px; }
.mm.framed { padding-top: 28px; }
.mm.arcs { padding-top: 46px; }
.mm.below { padding-bottom: 28px; }
.mm.fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 44px), transparent); }
.mm.fade-l { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 44px), transparent); }
.mm.fade-l.fade-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 44px, #000 calc(100% - 44px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 44px, #000 calc(100% - 44px), transparent); }
.mm-grid { position: relative; display: grid; column-gap: 20px; row-gap: 26px; width: max-content; padding: 0 10px; grid-auto-rows: calc(var(--mm-lines, 2) * 16px + 12px); }
.mm-fr { position: absolute; z-index: 0; pointer-events: none; border: 1.5px dashed color-mix(in srgb, var(--faint) 80%, transparent); border-radius: 12px;
  background: color-mix(in srgb, var(--paper2) 85%, transparent); }
.mm-flabel { position: absolute; z-index: 3; pointer-events: none; font-size: 12px; font-weight: 650; line-height: 15px; color: var(--muted); white-space: nowrap;
  text-shadow: 0 0 2px var(--paper2), 0 0 3px var(--paper2), 0 0 4px var(--paper2); }
.mm-box { position: relative; z-index: 2; display: flex; align-items: center; min-width: 0; padding: 5px 8px; text-align: left; font-size: 13px; line-height: 16px; border-radius: 9px; }
.mm-box .mm-role { display: block; overflow-wrap: break-word; }
.mm-box.actor { background: var(--actor); color: var(--actor-ink); }
.mm-box.thru { border-style: dashed; border-color: var(--faint); }
.mm-box.hint { box-shadow: 0 0 0 2px var(--ring); }
.mm-box.pass { border: 1.5px dashed var(--accent); }
.mm-box.via { border: 1.5px solid var(--accent); }
.mm-box.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 650; }
svg.mm-wires { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
svg.mm-wires .mm-e path { fill: none; stroke: var(--faint); stroke-width: 1.5; }
svg.mm-wires .arc:not(.lit) { display: none; }
svg.mm-wires .low:not(.lit) path { stroke-width: 1.2; opacity: .75; }
svg.mm-wires .mm-e.lit path { stroke: var(--accent); stroke-width: 2.6; }
.mm-legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.mm-legend .short { display: none; }
.mm-legend .k::before { content: ""; display: inline-block; width: 16px; height: 12px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; box-sizing: border-box; }
.mm-legend .k.now::before { background: var(--accent-soft); border: 2.5px solid var(--accent); }
.mm-legend .k.actor::before { background: var(--actor); border: 1px solid var(--actor-ink); }
.mm-legend .k.thru::before { border: 1.5px dashed var(--faint); }
.mm-legend .k.via::before { background: var(--card); border: 1.5px solid var(--accent); }  /* an outline only: the step's own box is filled */
.mm-legend .k.line::before { content: "→"; width: auto; height: auto; border: 0; color: var(--accent); font-weight: 700; line-height: 1; vertical-align: 0; }  /* with its arrowhead */
.mm-legend .k.back::before { height: 0; width: 16px; border-radius: 2px; border-top: 2.6px solid var(--accent); vertical-align: 3px; }  /* without one */
.chapters { list-style: none; margin: 10px 0 0; padding: 0; }
.chapter { border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.ch-head { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0;
  background: none; padding: 10px 6px; border-radius: 9px; }
.ch-head:hover { background: var(--paper2); }
.ch-n { width: 28px; height: 28px; border-radius: 7px; border: 3px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.chapter.open .ch-n { background: var(--accent); color: var(--card); }
.ch-label { font-weight: 650; font-size: 16px; }
.ch-box { font-size: 13px; color: var(--muted); }
.ch-steps { font-size: 13px; color: var(--faint); white-space: nowrap; }
.ch-steps::after { content: " ▸"; }

.next { margin-top: 6px; }

.next-plain { margin: 6px 0; padding: 0 2px; color: var(--muted); }

/* the component page */
.cp { padding: 22px 32px 44px; max-width: 1060px; }
.kindline { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }

.cp .jobline { margin: 2px 0 6px; font-size: 16.5px; color: var(--muted); }
.cp .purpose { margin: 8px 0; font-family: var(--serif); font-size: 17px; max-width: 72ch; }
.cp .why { margin: 0 0 8px; font-family: var(--serif); font-style: italic; color: var(--muted); max-width: 72ch; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--muted); align-items: center; }

.tgroup h4 { margin: 12px 0 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
.tlist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 4px; }
.tlist .dir { color: var(--muted); }
.tlist .part { color: var(--muted); }
.tlist .tag { margin-left: auto; padding-left: 12px; font-size: 12px; color: var(--faint); white-space: nowrap; }
.tlist .tag a.sym { font-size: 12px; }
.also-imports { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.also-imports .linky { color: var(--muted); text-decoration: underline dotted; }
.steplink { border: 0; background: none; padding: 0 2px; color: var(--sym); font-weight: 650; }
.steplink:hover { text-decoration: underline; }
.seelevel { margin-top: 10px; font-weight: 650; }
.kgroup h4 { margin: 10px 0 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
.klist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; }
.kname { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.kwhere, .cp li .n { font: 12px var(--mono); color: var(--muted); }
.kdoc { grid-column: 1 / -1; font-size: 13px; color: var(--muted); max-width: 90ch; }
.cp li .n { float: right; margin-left: 10px; }
.cp .f { font: 12.5px var(--mono); }
.note { font-size: 13px; color: var(--muted); }
details.more { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; list-style: none; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary .st::after { content: " ▸"; }
details.more[open] summary .st::after { content: " ▾"; }
.inparts { border: 0; background: none; padding: 0; color: var(--sym); font-weight: 600; font-size: 13px; }
.inparts:hover { text-decoration: underline; }
details.more summary .inparts { margin-left: 12px; text-transform: none; letter-spacing: 0; }

/* a level: today's grid and router, at rest drawing only the links the paths take */
.lv-head { padding: 18px 32px 0; }
.lv-head h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.lv-head p { margin: 4px 0 0; }
.stage-wrap { overflow-x: auto; margin: 6px 0 0; padding: 0 32px; }
.stage { position: relative; width: max-content; min-width: 100%; }
.grid { display: flex; gap: var(--gx); padding: 26px calc(var(--gx) / 2) 30px; align-items: stretch; }
.col { width: var(--colw); flex: none; display: flex; flex-direction: column; justify-content: center; gap: var(--gy); }
.support { margin-top: 10px; padding: 16px 0 4px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 16px; }
.support > .label { width: 100%; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.support .card { flex: 0 1 300px; }
.card { position: relative; z-index: 2; background: var(--card); border: 1px solid var(--line); border-radius: 13px;
  padding: 12px 14px 11px; box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 3px 10px rgb(0 0 0 / .03); transition: opacity .18s, box-shadow .18s; }
.card:hover { box-shadow: 0 2px 4px rgb(0 0 0 / .06), 0 8px 22px rgb(0 0 0 / .09); }
.card.lit { box-shadow: 0 0 0 3px var(--accent), 0 8px 22px rgb(0 0 0 / .1); }
.card.dim { opacity: .35; }
.card-main { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; color: inherit; }
.card .top { display: flex; gap: 9px; align-items: flex-start; }
.card .role { font-weight: 650; font-size: 15.5px; line-height: 1.25; flex: 1; padding-top: 5px; }
.card .job { display: block; margin: 7px 0 1px; font-family: var(--serif); font-size: 14.5px; line-height: 1.4; }
.card .quiet { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.open-inside { margin-top: 9px; width: 100%; text-align: left; font-size: 12.5px; font-weight: 650; color: var(--kind-ink);
  background: var(--kind); border: 0; border-radius: 8px; padding: 5px 9px; display: flex; justify-content: space-between; }
.outs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip.out { padding: 1px 9px; border-radius: 9px; font-size: 12.5px; line-height: 1.35; color: var(--muted); border-style: dashed; }
.chip.out:hover, .chip.out:focus-visible { color: var(--ink); border-style: solid; }
svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
svg.wires path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: help; }
svg.wires path.w { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; transition: opacity .18s; }
svg.wires path.w.async { stroke: var(--async); stroke-dasharray: 1 6; stroke-width: 2.6; }
svg.wires path.w.read, svg.wires path.w.write { stroke: var(--data); stroke-width: 1.9; }
svg.wires path.w.stream { stroke: var(--stream); stroke-dasharray: 10 3 2 3; stroke-width: 2.2; }
svg.wires path.w.depends { stroke: var(--dep); stroke-width: 1.3; }
svg.wires path.w.repair { stroke: var(--repair); stroke-dasharray: 6 5; stroke-width: 1.7; }
svg.wires path.w.dep { stroke: var(--dep); stroke-dasharray: 2 4; stroke-width: 1.4; }
svg.wires path.w.dep.undrawn { stroke: var(--warn); stroke-width: 1.7; }
svg.wires path.w.dep.bad { stroke: var(--bad); stroke-width: 2; }
svg.wires .lbl { font: 12px var(--ui-face); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 6px; stroke-linejoin: round; }
svg.wires .lbl.repair { font-style: italic; }
svg.wires .lbl.dep { font: 11px var(--mono); fill: var(--warn); }
svg.wires g.hidden { display: none; }
svg.wires g.faded { opacity: .12; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 32px 0; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend svg { vertical-align: middle; margin-right: 5px; }
.legend .sw { display: inline-flex; align-items: center; gap: 5px; }

/* states: a lifecycle as a table on its card's page, its drawing behind a fold */
.lcx { margin-bottom: 18px; }
.lcx .lc-name { margin: 0 0 4px; font-weight: 650; font-size: 15px; }
.lcx .lc-line { margin: 4px 0; font-size: 14px; color: var(--muted); }
.lcx .lc-line b { color: var(--ink); font-weight: 650; font-size: 13px; letter-spacing: .02em; }
.lcx .lc-line a.sym { font: inherit; }
.lc-table { border-collapse: collapse; margin: 8px 0; font-size: 14px; min-width: min(100%, 560px); }
.lc-table th, .lc-table td { text-align: left; padding: 5px 14px 5px 0; vertical-align: baseline; }
.lc-table thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; border-bottom: 1px solid var(--line); }
.lc-table tbody { border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.lc-table tbody th { font-size: 13px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
.lc-table td.to { font-size: 13px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
.lc-table td.to.stays { font-weight: 400; color: var(--muted); letter-spacing: 0; }
.lc-table a.sym { font: inherit; color: var(--sym); }
a.sym.prose { font: inherit; padding: 0; }
details.lc-draw { margin-top: 6px; }
details.lc-draw summary { cursor: pointer; list-style: none; color: var(--sym); font-weight: 600; font-size: 13.5px; }
details.lc-draw summary::-webkit-details-marker { display: none; }
details.lc-draw summary::after { content: " ▸"; }

details.lc-draw .lc-box { margin-top: 8px; }
.lc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; overflow-x: auto; }
.lc .lc-title { font-weight: 650; }
.lc .lc-states { margin-left: 10px; font-size: 12.5px; color: var(--muted); }
.lc svg { display: block; margin-top: 4px; overflow: visible; }
.lc svg .st rect { fill: var(--paper2); stroke: var(--line); }
.lc svg .st text { font: 600 12.5px var(--ui-face); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }

  .mm-legend { gap: 2px 12px; margin-bottom: 10px; }
  .mm-legend .full { display: none; }
  .mm-legend .short { display: inline; }
  .rows { padding-left: 0; }
  .ch-head { grid-template-columns: 30px minmax(0, 1fr) auto; row-gap: 0; }
  .ch-box { grid-column: 2; grid-row: 2; }

  .chap .cbox { grid-column: 2; text-align: left; }
}
@media (max-width: 560px) {
  .stepcount .ch-of { display: none; }  /* a phone pins one row of controls: "Step 12 of 16" */
}

ctl.go","name":"StoreDown","line":106,"end":132,"doc":"StoreDown takes the store down for d (FLT-1 (a), DESIGN §B6; plan H4 step 1): BGREWRITEAOF as the ops user, so the reload is short, then INFO persistence every 50 ms until aof_rewrite_in_progress:0 (and aof_rewrite_scheduled:0); SHUTDOWN, whose reply is the connection closing (EOF counts as success), and a wait until the port refuses connections; then d after SHUTDOWN, the restart (t.Restart, or t.Args with the new PID written to t.PIDFile at once); probes until the first successful PING; and the store's PID, read from INFO server, in t.PIDFile (checked against the PID already written after a…"},{"ref":"harness/fixtures/storectl.go:StorePause","path":"harness/fixtures/storectl.go","name":"StorePause","line":144,"end":182,"doc":"StorePause stops the store for d (FLT-2, a blackhole outage, DESIGN §B6; plan H4 step 1): SIGSTOP to the PID in t.PIDFile, once INFO server shows the store at t.Addr is that process (plan choice: a stale PID file never stops another process), then SIGCONT d later, then probes until the first successful PING."},{"ref":"harness/fixtures/apictl.go:KillAPI","path":"harness/fixtures/apictl.go","name":"KillAPI","line":130,"end":163,"doc":"KillAPI kills one hitapi instance (FLT-6, DESIGN §B6; plan H4 step 2): POST /_test/prekill first, within t.PrekillTimeout; then one line {\"kind\":\"lifecycle\",\"event\":\"pre_kill\", \"listener_drops\":…,\"log_drops\":…,\"read_ok\":…} appended to t.LogPath with a single O_APPEND write(2) (runlog.Append); then SIGKILL to t.PID, and a wait until the process is gone (reaped, or a zombie: it holds no socket any more); with restart, the instance started again (t.Start, or t.Args as a detached child) and a wait of at most 30 s until GET /health shows status ready."},{"ref":"harness/fixtures/tamper.go:Tamper","path":"harness/fixtures/tamper.go","name":"Tamper","line":32,"end":35,"doc":"Tamper is the state tamper tool (DESIGN §B6; HARNESS FLT-7, FLT-11, §9.4; IMPLEM integrity_error.","card":"core.health"},{"ref":"internal/core/slots.go:slots.tryAcquire","path":"internal/core/slots.go","name":"slots.tryAcquire","line":28,"end":38,"doc":"tryAcquire reserves one receipt slot and one refund slot, or neither: it returns false at once, without waiting, when either kind is full (busy, API-7b).","text":"It reserves one receipt slot and one refund slot together, without waiting.","otherwise":"Either kind full: busy, and nothing goes to Valkey.","card":"core.permits"},{"ref":"internal/core/acquire.go:Limiter.send","path":"internal/core/acquire.go","name":"Limiter.send","line":65,"end":103,"doc":"send runs EVALSHA acquire once with the §A4.1 KEYS and ARGV under the held epoch and its floors, and maps the outcome (§A4.9, §A5.3).","text":"The receipt-lifetime clock starts. An acquire call goes to the adapter with the epoch's keys, the policy fingerprint, and the highest store time and generation seen, to catch rollbacks.","otherwise":"Store unreachable: unavailable, or degraded (no charge) if the policy fails open.","card":"core.acquire"},{"ref":"internal/store/adapter.go:StoreAdapter.Call","path":"internal/store/adapter.go","name":"StoreAdapter.Call","line":227,"end":234,"doc":"Call runs one script (DESIGN §A5.4) and observes rl_store_call_seconds{script} once.","text":"The adapter sends it on the least busy connection, within the app's deadline and the store-call limit (2 s default).","otherwise":"NOSCRIPT, proof it never ran, gets one reload and resend; nothing else is resent.","card":"store"},{"ref":"internal/store/pipe.go:pipeConn.write","path":"internal/store/pipe.go","name":"pipeConn.write","line":119,"end":155,"doc":"write appends calls to the FIFO and then writes buf, their concatenated commands, in one Write whose deadline is the batch's, ctx's deadline (plan choice: the earliest call deadline); the caller holds the write lock.","text":"The command is written right away, without waiting for earlier replies. The writer tracks which bytes left, so it knows for sure whether this command was sent.","otherwise":"","card":"store"},{"ref":"internal/scripts/prelude.lua:enter","path":"internal/scripts/prelude.lua","name":"enter","line":271,"end":282,"doc":"enter runs the prelude steps in order (API-1a steps 1 and 2): the record, its id and fp, the per-key KEYS when enc is given (right after the epoch check, §A4.1), the floors, the clock.","text":"Inside Valkey, the script starts with the prelude's shared checks: load the epoch record, match its ID and fingerprint, check key names and rollbacks, then read the clock once.","otherwise":"A failed check refuses (config, clock or integrity error); a rollback also puts the epoch on hold.","card":"scripts"},{"ref":"internal/scripts/acquire.lua:12","path":"internal/scripts/acquire.lua","name":"12","line":12,"end":12,"doc":"local qok, qv = pcall(redis.call, 'HEXISTS', K.q, enc)","text":"The script checks the key is not quarantined (locked), then checks its stored bucket before any write.","otherwise":"A quarantined key is refused. Damage quarantines the key, or holds the whole epoch if a shared key is damaged.","card":"scripts"},{"ref":"internal/scripts/acquire.lua:29","path":"internal/scripts/acquire.lua","name":"29","line":29,"end":29,"doc":"local u = refill(b.u, cap_units, t - b.t, rate_tokens)","text":"A known key is refilled for the time passed; a key seen for the first time starts full and takes its token at once (line 23).","otherwise":"Under one token: limited, nothing written. A new key past the tracked-key cap: capacity_error.","card":"scripts"},{"ref":"internal/scripts/acquire.lua:32","path":"internal/scripts/acquire.lua","name":"32","line":32,"end":32,"doc":"u = u - rate_period_ns","text":"For a known key, one token is taken here. The script saves the bucket, its cleanup time and the latest store time, and replies with the generation, sequence and expiry.","otherwise":"","card":"scripts"},{"ref":"internal/store/reply.go:Decode","path":"internal/store/reply.go","name":"Decode","line":197,"end":237,"doc":"Decode checks reply against script's §A4.9 layout for its code (exact length, or the due_entries minimum, or admin_inspect's 13 + n; each element's kind) and then every range check, computed from lim: every integer in 0 … 2^53 − 1; t_us 0 where the layout shows 0, else below TBOUND; and the per-code bounds.","text":"Back in Go, the reply is decoded: it must have the expected shape for its code, with every value in range.","otherwise":"Any other reply makes the result outcome_unknown.","card":"store"},{"ref":"internal/core/acquire.go:Limiter.decide","path":"internal/core/acquire.go","name":"Limiter.decide","line":126,"end":156,"doc":"decide maps a decoded acquire reply to its result (§A4.9).","text":"The reply becomes the result. On this path it is allowed, so the receipt is built next.","otherwise":"Limited gets an exact retry-after time; epoch-wide refusals make the epoch watch re-read early.","card":"core.acquire"},{"ref":"internal/receipt/signer.go:HMACSigner.Sign","path":"internal/receipt/signer.go","name":"HMACSigner.Sign","line":50,"end":60,"doc":"Sign returns r with MAC = HMAC-SHA256(key, MACInput(r)).","text":"The receipt says which token was taken and when it expires. It is signed with this instance's secret key (HMAC-SHA256).","otherwise":"Signing fails: receipt_error, no permit, and the token stays spent.","card":"blocks"},{"ref":"internal/core/permit.go:newPermit","path":"internal/core/permit.go","name":"newPermit","line":183,"end":192,"doc":"newPermit returns an OPEN permit that holds one reservation of sl, and arms its retention timer through r (§A5.5, REF-4a).","text":"Acquire returns allowed with an OPEN permit holding the receipt and both slots. If still open when the receipt's lifetime ends, a timer expires it.","otherwise":"","card":"core.permits"}],"loop":null,"main":true,"tools":false,"chapters":[{"label":"The app calls Acquire for a key","first":1,"last":3,"box":"api","auto":false},{"labe "hop":["valkey>scripts","store>valkey"],"hop_back":["valkey>scripts","store>valkey"],"loop":null},{"n":14,"text":"The reply becomes the result. On this path it is allowed, so the receipt is built next.","otherwise":"Limited gets an exact retry-after time; epoch-wide refusals make the epoch watch re-read early.","ref":"internal/core/acquire.go:Limiter.decide","path":"internal/core/acquire.go","line":126,"name":"Limiter.decide","doc":"decide maps a decoded acquire reply to its result (§A4.9).","card":"core.acquire","box":"core","part":"core.acquire","chapter":4,"hop":["core>store"],"hop_back":["core>store"],"loop":null},{"n":15,"text":"The receipt says which token was taken and when it expires. It is signed with this instance's secret key (HMAC-SHA256).","otherwise":"Signing fails: receipt_error, no permit, and the token stays spent.","ref":"internal/receipt/signer.go:HMACSigner.Sign","path":"internal/receipt/signer.go","line":50,"name":"HMACSigner.Sign","doc":"Sign returns r with MAC = HMAC-SHA256(key, MACInput(r)).","card":"blocks","box":"blocks","part":null,"chapter":5,"hop":["core>blocks"],"hop_back":[],"loop":null},{"n":16,"text":"Acquire returns allowed with an OPEN permit holding the receipt and both slots. If still open when the receipt's lifetime ends, a timer expires it.","otherwise":"","ref":"internal/core/permit.go:newPermit","path":"internal/core/permit.go","line":183,"name":"newPermit","doc":"newPermit returns an OPEN permit that holds one reservation of sl, and arms its retention timer through r (§A5.5, REF-4a).","card":"core.permits","box":"core","part":"core.permits","chapter":6,"hop":["core>blocks"],"hop_back":["core>blocks"],"loop":null}],"minimap":{"boxes":["host","api","core","blocks","store","valkey","scripts"],"cells":{"host":{"row":0,"col":0},"api":{"row":0,"col":1},"core":{"row":0,"col":2},"store":{"row":0,"col":3},"valkey":{"row":0,"col":4},"scripts":{"row":0,"col":5},"blocks":{"row":1,"col":2}},"cols":6,"frames":[{"id":"library","label":"The Go library","boxes":["api","core","blocks","store"],"col0":1,"col1":3}],"edges":[{"id":"host>api","from":"host","to":"api","both":false,"members":[0],"adjacent":true},{"id":"api>core","from":"api","to":"core","both":false,"members":[2,3,4],"adjacent":true},{"id":"core>store","from":"core","to":"store","both":false,"members":[6,13,16,18],"adjacent":true},{"id":"store>valkey","from":"store","to":"valkey","both":false,"members":[7],"adjacent":true},{"id":"valkey>scripts","from":"valkey","to":"scripts","both":false,"members":[8],"adjacent":true},{"id":"core>blocks","from":"core","to":"blocks","both":false,"members":[9,12],"adjacent":true},{"id":"core>host","from":"core","to":"host","both":false,"members":[15],"adjacent":false}],"actor":"host","actor_hop":["host>api"],"actor_hop_back":[],"pass":["valkey"]},"hops":[{"steps":[1,2],"from":"api","to":"core","edges":["api>core"],"via":[],"back":[]},{"steps":[2,3],"from":"core","to":"blocks","edges":["core>blocks"],"via":[],"back":[]},{"steps":[3,4],"from":"blocks","to":"core","edges":["core>blocks"],"via":[],"back":["core>blocks"]},{"steps":[6,7],"from":"core","to":"store","edges":["core>store"],"via":[],"back":[]},{"steps":[8,9],"from":"store","to":"scripts","edges":["store>valkey","valkey>scripts"],"via":["valkey"],"back":[]},{"steps":[12,13],"from":"scripts","to":"store","edges":["valkey>scripts","store>valkey"],"via":["valkey"],"back":["valkey>scripts","store>valkey"]},{"steps":[13,14],"from":"store","to":"core","edges":["core>store"],"via":[],"back":["core>store"]},{"steps":[14,15],"from":"core","to":"blocks","edges":["core>blocks"],"via":[],"back":[]},{"steps":[15,16],"from":"blocks","to":"core","edges":["core>blocks"],"via":[],"back":["core>blocks"]}],"through":{"library":[1,2,3,4,5,6,7,8,13,14,15,16],"api":[1],"core":[2,4,5,6,14,16],"store":[7,8,13],"scripts":[9,10,11,12],"blocks":[3,15],"core.acquire":[2,6,14],"core.permits":[5,16],"core.health":[4]}},{"id":"refund","title":"Refund after a confirmed failure","proves":"Failed work's token returns at most once, even after a lost reply; the app hears at most one final event.","steps":[{"ref":"internal/core/permit.go:Permit.Release","path":"internal/core/permit.go","name":"Permit.Release","line":216,"end":221,"doc":"Release is the host's finish on a confirmed failure (API-1b): it returns at once, and the refund runs in the background (REF-4).","text":"The app's work surely failed, so it calls Release. Release returns at once, and the refund runs in the background while the app answers its caller.","otherwise":"After Close began, or once the permit expired, nothing is sent and the event says unresolved.","card":"core.permits"},{"ref":"internal/core/permit.go:lifecycle.fire","path":"internal/core/permit.go","name":"lifecycle.fire","line":315,"end":326,"doc":"fire applies ev with a compare-and-swap loop: it reads the state, looks up (state, ev) and swaps in the new state; when another event changed the state first, it reads it again.","text":"An atomic compare-and-swap moves the permit OPEN → RELEASED. Only the call that wins the swap acts, so a permit can finish only once.","otherwise":"","card":"core.permits"},{"ref":"internal/core/refund.go:refunds.enqueue","path":"internal/core/refund.go","name":"refunds.enqueue","line":377,"end":394,"doc":"enqueue is OPEN → RELEASED's effect: p becomes pending and goes on the ready queue.","text":"The refund job joins a queue, earliest release first. The queue has room for every refund slot, so it never overflows.","otherwise":"","card":"core.refunds"},{"ref":"internal/core/refund.go:refunds.next","path":"internal/core/refund.go","name":"refunds.next","line":314,"end":330,"doc":"next waits for a ready job and returns it with the context of its refund attempt (§A5.6), which is in flight from then until endAttempt: the job leaves the queue and its attempt starts under one hold of mu, so no transition's effects (settle) can run in between: a transition that ends the permit meanwhile, or later, finds the attempt in flight and cancels that context; the attempt then sends nothing more.","text":"A free worker (of 128 by default) takes the earliest job and starts an attempt. The receipt-lifetime timer can still cancel it.","otherwise":"","card":"core.refunds"},{"ref":"internal/receipt/signer.go:HMACSigner.Verify","path":"internal/receipt/signer.go","name":"HMACSigner.Verify","line":63,"end":69,"doc":"Verify reports whether r.MAC is this signer's MAC of r, compared in constant time.","text":"The worker first checks the receipt's signature.","otherwise":"A bad signature ends the job as receipt_invalid, and nothing is sent to Valkey.","card":"blocks"},{"ref":"internal/core/refund.go:Limiter.refundAttempt","path":"internal/core/refund.go","name":"Limiter.refundAttempt","line":77,"end":95,"doc":"refundAttempt is one refund attempt for p's receipt (§A5.6): a receipt whose MAC does not verify is final receipt_invalid with no store call (API-2a step 1); otherwise one Adapter.Call on the refund connections within D (the adapter's deadline on ctx, the refund workers' context), under the epoch the watch joined last, with its floors (§A4.1, §A5.7).","text":"The worker builds one refund call under the epoch the instance last joined, with the same rollback guards as acquire.","otherwise":"","card":"core.refunds"},{"ref":"internal/store/adapter.go:StoreAdapter.Call","path":"internal/store/adapter.go","name":"StoreAdapter.Call","line":227,"end":234,"doc":"Call runs one script (DESIGN §A5.4) and observes rl_store_call_seconds{script} once.","text":"The refund call goes out on the separate refund connections, within the store-call limit.","otherwise":"","card":"store"},{"ref":"internal/scripts/refund.lua:15","path":"internal/scripts/refund.lua","name":"15","line":15,"end":15,"doc":"if r_epoch ~= e.id then return finish(E_RECEIPT_INVALID, 'epoch') end -- step 4","text":"In Valkey, after the prelude, the receipt must be from this epoch and not expired. Then come the quarantine, bucket and generation checks.","otherwise":"Another epoch's receipt: receipt_invalid. An expired one: receipt_expired.","card":"scripts"},{"ref":"internal/scripts/refund.lua:29","path":"internal/scripts/refund.lua","name":"29","line":29,"end":29,"doc":"if mval then return finish(E_ALREADY_APPLIED, '', mval.credit) end -- step 8 (check_key verified its mi entry)","text":"It looks for this receipt's marker, so a refund never counts twice.","otherwise":"Marker found: already_applied, so a resend is safe.","card":"scripts"},{"ref":"internal/scripts/refund.lua:35","path":"internal/scripts/refund.lua","name":"35","line":35,"end":35,"doc":"redis.call('HSET', K.k, 'u', u + credited, 't', t, 'm:' .. gs, string.format('%d:%d', expiry_us, t), 'mc', b.mc + 1)","text":"The token is credited here: the bucket is refilled, one token goes back (capped at capacity), and a marker records when.","otherwise":"Marker limits reached: capacity_error, retried later.","card":"scripts"},{"ref":"internal/core/refund.go:classifyRefund","path":"internal/core/refund.go","name":"classifyRefund","line":41,"end":70,"doc":"classifyRefund maps one refund response to its attemptResult (§A5.6; SPEC API-13 … API-19).","text":"Applied, already applied, invalid and expired are final answers. Everything else, such as refusals, an unreachable store or an unknown outcome, is retried.","otherwise":"","card":"core.refunds"},{"ref":"internal/core/refund.go:refunds.retry","path":"internal/core/refund.go","name":"refunds.retry","line":335,"end":344,"doc":"retry arms p's backoff timer (§A5.6): min(RefundBackoffMax, RefundBackoffInitial × 2^n) × U[0.5, 1.0]; when it fires, p goes back to the queue with its original release time.","text":"If the result is not final: a backoff timer (50 ms, doubling up to 1 s, with jitter) puts the job back in the queue at its original place.","otherwise":"","card":"core.refunds"},{"ref":"internal/core/permit.go:Permit.finish","path":"internal/core/permit.go","name":"Permit.finish","line":250,"end":254,"doc":"finish is a refund worker's final result (RELEASED → FINAL): a loser drops it.","text":"Once a result is final: the permit moves RELEASED → FINAL, both slots are freed, and exactly one event follows.","otherwise":"If the receipt's lifetime runs out first, Permit.expire ends it as unresolved.","card":"core.permits"},{"ref":"internal/core/refund.go:refunds.emit","path":"internal/core/refund.go","name":"refunds.emit","line":463,"end":486,"doc":"emit builds p's one final event (API-1d), counts it in rl_refund_results_total and hands it to the listener, if any.","text":"The RefundEvent says which deduction it was, how the refund ended, how many commands were sent and when the credit happened. It is counted and queued for the listener.","otherwise":"","card":"core.refunds"},{"ref":"internal/core/listener.go:listener.deliver","path":"internal/core/listener.go","name":"listener.deliver","line":105,"end":108,"doc":"deliver calls the host's listener; a panic in it is recovered and ignored (DESIGN §A5.11: host code may panic, and listener errors never affect the limiter, API-1d).","text":"One goroutine calls the app's listener, catching any panic.","otherwise":"If the queue is full, the event is dropped and counted in Health.ListenerDrops.","card":"core.listener"}],"loop":[12,4,"retry until a final result"],"main":false,"tools":false,"chapters":[{"label":"The app releases the permit","first":1,"last":3,"box":"core.permits","auto":false},{"label":"A worker checks the receipt","first":4,"last":6,"box":"core.refunds","auto":false},{"label":"The refund script runs in Valkey","first":7,"last":10,"box":"scripts","auto":false},{"label":"Final, or retry later","first":11,"last":12,"box":"core.refunds","auto":false},{"label":"The app may hear how it ended","first":13,"last":15,"box":"core.listener","auto":false}],"next":[],"main_box":"core","rows":[{"n":1,"text":"The app's work surely failed, so it calls Release. Release returns at once, and the refund runs in the ","part":null,"chapter":2,"hop":["core.refunds>store"],"hop_back":[],"loop":null},{"n":8,"text":"In Valkey, after the prelude, the receipt must be from this epoch and not expired. Then come the quarantine, bucket and generation checks.","otherwise":"Another epoch's receipt: receipt_invalid. An expired one: receipt_expired.","ref":"internal/scripts/refund.lua:15","path":"internal/scripts/refund.lua","line":15,"name":"15","doc":"if r_epoch ~= e.id then return finish(E_RECEIPT_INVALID, 'epoch') end -- step 4","card":"scripts","box":"scripts","part":null,"chapter":2,"hop":["store>valkey","valkey>scripts"],"hop_back":[],"loop":null},{"n":9,"text":"It looks for this receipt's marker, so a refund never counts twice.","otherwise":"Marker found: already_applied, so a resend is safe.","ref":"internal/scripts/refund.lua:29","path":"internal/scripts/refund.lua","line":29,"name":"29","doc":"if mval then return finish(E_ALREADY_APPLIED, '', mval.credit) end -- step 8 (check_key verified its mi entry)","card":"scripts","box":"scripts","part":null,"chapter":2,"hop":null,"hop_back":[],"loop":null},{"n":10,"text":"The token is credited here: the bucket is refilled, one token goes back (capped at capacity), and a marker records when.","otherwise":"Marker limits reached: capacity_error, retried later.","ref":"internal/scripts/refund.lua:35","path":"internal/scripts/refund.lua","line":35,"name":"35","doc":"redis.call('HSET', K.k, 'u', u + credited, 't', t, 'm:' .. gs, string.format('%d:%d', expiry_us, t), 'mc', b.mc + 1)","card":"scripts","box":"scripts","part":null,"chapter":2,"hop":null,"hop_back":[],"loop":null},{"n":11,"text":"Applied, already applied, invalid and expired are final answers. Everything else, such as refusals, an unreachable store or an unknown outcome, is retried.","otherwise":"","ref":"internal/core/refund.go:classifyRefund","path":"internal/core/refund.go","line":41,"name":"classifyRefund","doc":"classifyRefund maps one refund response to its attemptResult (§A5.6; omplete pass, and only then, keys left over from older epochs are removed.","otherwise":"","ref":"internal/core/reclaim.go:Limiter.reclaim","path":"internal/core/reclaim.go","line":25,"name":"Limiter.reclaim","doc":"reclaim runs after every completed cleanup pass, and only then (DESIGN §A4.7; SPEC ADM-1): it continues the instance's SCAN cursor for at most 10 calls, stopping early when a full iteration ends (cursor 0), and sends the keys outside the joined epoch's namespace id to reclaim.lua in batches of ReclaimBatch, the rest in one last batch, adding the keys each call unlinked to rl_reclaim_keys_total.","card":"core.cleanup","box":"core.cleanup","part":null,"chapter":3,"hop":null,"hop_back":[],"loop":null}],"minimap":{"boxes":["core.cleanup","store","valkey","scripts"],"cells":{"core.cleanup":{"row":0,"col":0},"store":{"row":0,"col":1},"valkey":{"row":0,"col":2},"scripts":{"row":0,"col":3}},"cols":4,"frames":[{"id":"core","label":"The limiter core","boxes":["core.cleanup"],"col0":0,"col1":0}],"edges":[{"id":"store>valkey","from":"store","to":"valkey","both":false,"members":[7],"adjacent":true},{"id":"valkey>scripts","from":"valkey","to":"scripts","both":false,"members":[8],"adjacent":true},{"id":"core.cleanup>store","from":"core.cleanup","to":"store","both":false,"members":[18],"adjacent":true}],"actor":null,"actor_hop":[],"actor_hop_back":[],"pass":["valkey"]},"hops":[{"steps":[3,4],"from":"core.cleanup","to":"scripts","edges":["core.cleanup>store","store>valkey","valkey>scripts"],"via":["store","valkey"],"back":[]},{"steps":[4,5],"from":"scripts","to":"store","edges":["valkey>scripts","store>valkey"],"via":["valkey"],"back":["valkey>scripts","store>valkey"]},{"steps":[5,6],"from":"store","to":"scripts","edges":["store>valkey","valkey>scripts"],"via":["valkey"],"back":[]},{"steps":[6,7],"from":"scripts","to":"core.cleanup","edges":["valkey>scripts","store>valkey","core.cleanup>store"],"via":["valkey","store"],"back":["valkey>scripts","store>valkey","core.cleanup>store"]}],"through":{"library":[1,2,3,5,7,8],"core":[1,2,3,7,8],"store":[5],"scripts":[4,6],"core.cleanup":[1,2,3,7,8]}},{"id":"scenario","title":"One scenario run through the harness","proves":"A scenario's repeatable traffic runs through real processes, and its report is built and checked from saved logs only.","steps":[{"ref":"cmd/orchestrator/main.go:orchestrate","path":"cmd/orchestrator/main.go","name":"orchestrate","line":82,"end":133,"doc":"orchestrate runs the orchestrator and returns its exit code: the command line, preflight, the pid file, the run directory, then the run sequence.","text":"make run starts the orchestrator. After preflight checks it creates runs/<id>/, holding the merged config and an access-control file with fresh passwords.","otherwise":"A failed preflight check refuses the run (exit 2) before anything starts.","card":"harness.orchestrator"},{"ref":"cmd/orchestrator/run.go:runner.startStore","path":"cmd/orchestrator/run.go","name":"runner.startStore","line":660,"end":689,"doc":"startStore starts valkey-server with the run's store profile through the file-limit shell (storeArgs, runlog.FileLimitCommand) and waits until it answers PING as rl_ops, at most storeStartWait; a store that exits first fails the run.","text":"It starts a fresh Valkey server, set up to save every write to disk, with its data in the run folder, and waits until it answers.","otherwise":"","card":"harness.orchestrator"},{"ref":"cmd/orchestrator/run.go:runner.run","path":"cmd/orchestrator/run.go","name":"runner.run","line":206,"end":260,"doc":"run is the sequence (DESIGN §B5; HARNESS §4).","text":"Then PostgreSQL: started unless already running, and its hits table emptied, so each run starts clean.","otherwise":"","card":"harness.orchestrator"},{"ref":"cmd/orchestrator/run.go:runner.startEpoch","path":"cmd/orchestrator/run.go","name":"runner.startEpoch","line":752,"end":776,"doc":"startEpoch runs `rladmin start-epoch --policy runs/<id>/config.toml --json` from the bin directory as rl_admin (DESIGN §A6; plan H3 step 3: no flag, the store is fresh) and records the epoch ID it printed in context.json.","text":"It runs rladmin start-epoch with the run's policy. The new epoch ID that rladmin prints is saved in context.json.","otherwise":"","card":"harness.orchestrator"},{"ref":"cmd/rladmin/commands.go:startEpoch","path":"cmd/rladmin/commands.go","name":"startEpoch","line":113,"end":135,"doc":"startEpoch is ADM-1 (DESIGN §A4.6, §A6): admin_start_epoch with a new ID, the policy's fingerprint, schema 1 and clock source, and the replace flag with the expected ID.","text":"rladmin picks a random 128-bit epoch ID and sends the start-epoch script with the policy's fingerprint, the data layout version and the clock source.","otherwise":"","card":"rladmin"},{"ref":"internal/scripts/admin_start_epoch.lua:20","path":"internal/scripts/admin_start_epoch.lua","name":"20","line":20,"end":20,"doc":"redis.call('DEL', K.epoch)","text":"The script writes the new epoch record: ID, fingerprint, layout, clock, no hold, a starting time and zero counters.","otherwise":"Without --replace, the script refuses if a readable epoch record exists.","card":"scripts"},{"ref":"cmd/orchestrator/run.go:runner.instancesStep","path":"cmd/orchestrator/run.go","name":"runner.instancesStep","line":287,"end":301,"doc":"instancesStep starts the instances (startAPIs), waits until they are ready (waitReady) and, in a benchmark run, refuses the run when an instance's /health cannot show production construction (guardHealth; HAR-24, DESIGN §B5 \"Benchmark guard\").","text":"It starts the hitapi apps, number N on port 8080+N, each with its own log and the run's config (or a per-app override), and polls /health until all are ready.","otherwise":"","card":"harness.orchestrator"},{"ref":"cmd/sampler/sampler.go:sampler.tick","path":"cmd/sampler/sampler.go","name":"sampler.tick","line":170,"end":205,"doc":"tick takes one sample and enqueues its line.","text":"It starts the sampler before the traffic. Every second the sampler logs each process's CPU and memory, each app's health and metrics, and the store's stats.","otherwise":"","card":"harness.sampler"},{"ref":"cmd/hitgen/main.go:run","path":"cmd/hitgen/main.go","name":"run","line":65,"end":124,"doc":"run runs hitgen: the schedule, then the sending until it is done or ctx ends (SIGTERM).","text":"Then hitgen: it plans the whole schedule from a seed and saves it before sending anything. Its 'sending' log line marks time zero.","otherwise":"","card":"harness.hitgen"},{"ref":"cmd/hitgen/sender.go:sender.send","path":"cmd/hitgen/sender.go","name":"sender.send","line":407,"end":428,"doc":"send makes attempt `attempt` of entry e in the slot taken for it, frees the slot and records the attempt; h and jitter are what a retry waited for.","text":"Each planned request becomes a GET /hit with a user ID and request ID.","otherwise":"A 429 gets at most two retries, same IDs, after the suggested wait plus jitter.","card":"harness.hitgen"},{"ref":"harness/httpapi/hit.go:Server.hit","path":"harness/httpapi/hit.go","name":"Server.hit","line":34,"end":46,"doc":"hit serves GET /hit in the DESIGN §B3 order: arrival time, header checks, the in-flight slot, the P deadline, acquire (skipped when the limiter is off, HAR-17), the refusal after acquire, the database work, then done() or release() and the response.","text":"hitapi notes the arrival time, checks headers and takes an in-flight slot, then calls Acquire keyed by user ID, under a deadline the client cannot cancel.","otherwise":"Limited answers 429 with a retry hint; any other refusal gets an error, and no row is written.","card":"harness.hitapi"},{"ref":"harness/dbclient/dbclient.go:Client.Hit","path":"harness/dbclient/dbclient.go","name":"Client.Hit","line":190,"end":227,"doc":"Hit inserts the row (userID, requestID, arrivalNs), or reads the row that already holds the key, and classifies the outcome exactly per the DESIGN §B3 table.","text":"If allowed, it inserts the row within the time left, reading the existing one if the insert added nothing. What it learns about the row picks Done or Release.","otherwise":"","card":"harness.dbclient"},{"ref":"harness/runlog/runlog.go:Writer.Enqueue","path":"harness/runlog/runlog.go","name":"Writer.Enqueue","line":145,"end":166,"doc":"Enqueue encodes rec as one JSON line and hands it to the writer goroutine.","text":"Its decision, request, release and refund records go to api-N.jsonl, one system call per line.","otherwise":"A full queue counts a drop, and any drop invalidates the run.","card":"harness.runlog"},{"ref":"cmd/orchestrator/run.go:runner.finishRun","path":"cmd/orchestrator/run.go","name":"runner.finishRun","line":331,"end":420,"doc":"finishRun is the end of a run whose hitgen has exited (IMPLEMENTATION_PLAN H3 steps 3 and 4, H5 step 7): the instances stop gracefully, db_rows.json, the sampler stops, context.json, the report and its validation, the store's shutdown, a valid baseline's thresholds freeze and the run index.","text":"When hitgen finishes, each hitapi is told to stop (SIGTERM) and drains its refunds. The row count is saved, the sampler stops, and context.json is written.","otherwise":"","card":"harness.orchestrator"},{"ref":"report/build.py:build","path":"report/build.py","name":"build","line":2283,"end":2311,"doc":"report.json's content for the run in run_dir (H5 step 2): every section from the run's saved evidence only (HAR-9).","text":"The Python report builder reads the saved logs line by line into report.json and report.md, including the per-window budget check's verdict.","otherwise":"","card":"judge.builder"},{"ref":"report/validate.py:check","path":"report/validate.py","name":"check","line":1472,"end":1509,"doc":"Every check of the given mode on the run in run_dir; the failed ones, in order.","text":"Then the validator re-checks the report against the run's context and scenario. A valid baseline then freezes its thresholds.","otherwise":"A failure marks the report invalid, and make run exits 1.","card":"judge.validate"}],"loop":null,"main":false,"tools":true,"chapters":[{"label":"Set up the run","first":1,"last":3,"box":"harness.orchestrator","auto":false},{"label":"Start the epoch","first":4,"last":6,"box":"rladmin","auto":false},{"label":"Start the apps and sampler","first":7,"last":8,"box":"harness.orchestrator","auto":false},{"label":"Send the traffic","first":9,"last":13,"box":"harness.hitgen","auto":false},{"label":"Stop and build the report","first":14,"last":16,"box":"judge","auto":false}],"next":[],"main_box":"harness","rows":[{"n":1,"text":"make run starts the orchestrator. After preflight checks it creates runs/<id>/, holding the merged config and an access-control file with fresh passwords.","otherwise":"A failed preflight check refuses the run (exit 2) before anything starts.","ref":"cmd/orchestrator/main.go:orchestrate","path":"cmd/orchestrator/main.go","line":82,"name":"orchestrate","doc":"orchestrate runs the orchestrator and returns its exit code: the command line, preflight, the pid file, the run directory, then the run sequence.","card":"harness.orchestrator","box":"harness.orchestrator","part":null,"chapter":0,"hop":null,"hop_back":[],"loop":null},{"n":2,"text":"It starts a fresh Valkey server, set up to save every write to disk, with its data in the run folder, and waits until it answers.","otherwise":"","ref":"cmd/orchestrator/run.go:runner.startStore","path":"cmd/orchestrator/run.go","line":660,"name":"runner.startStore","doc":"startStore starts valkey-server with the run's store profile through the file-limit shell (storeArgs, runlog.FileLimitCommand) and waits until it answers PING as rl_ops, at most storeStartWait; a store that exits first fails the run.","card":"harness.orchestrator","box":"harness.orchestrator","part":null,"chapter":0,"hop":null,"hop_back":[],"loop":null},{"n":3,"text":"Then PostgreSQL: started unless already running, and its hits table emptied, so each run starts clean   function pick(h) {  // a path opens at step 1; a step opens its path there; a part its page; a code name or file its card's page, flashing it
    $("results").classList.remove("on"); $("find").value = ""; $("count").textContent = ""; $("find").blur();
    if (h.kind === "path") nav(`#/path/${h.j.id}/1`);
    else if (h.kind === "step") nav(`#/path/${h.j.id}/${h.r.n}`);
    else nav(`#/card/${h.id}`, h.kind === "sym" ? { ref: h.s.ref } : h.kind === "file" ? { file: h.f.path } : null);
  }
  $("find").addEventListener("input", applyFind);
  $("find").addEventListener("focus", applyFind);
  $("find").addEventListener("blur", () => setTimeout(() => $("results").classList.remove("on"), 150));
  $("find").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, Math.min(hits.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
      const bs = [...$("results").querySelectorAll("button")]; bs.forEach((b, i) => b.classList.toggle("sel", i === sel)); bs[sel]?.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter" && hits[sel]) pick(hits[sel]);
    if (e.key === "Escape") { e.stopPropagation(); $("find").value = ""; applyFind(); $("find").blur(); } });

  // ------------------------------------------------------------ keys, footer, start
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (closeMenus()) return; if (view !== "overview") { e.preventDefault(); nav("#/"); } return; }
    if (e.target.matches?.("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (view === "path" && P && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { setStep(P.at + (e.key === "ArrowRight" ? 1 : -1)); e.preventDefault(); }
    else if (e.key === "/") { e.preventDefault(); $("find").focus(); }
    else if (e.key === "d") toggles.deps(!showDeps); else if (e.key === "r") toggles.repairs(!showRepairs);
    else if ((e.key === "Backspace" || e.key === "u") && view === "level" && level) { e.preventDefault(); nav(`#/level/${C[level].parent || ""}`); } });
  document.addEventListener("click", (e) => { if (!e.target.closest?.(".menu")) closeMenus(); });
  const gr = M.grounding, st = M.stats, total = Math.max(1, st.lines);
  const byLang = {}; st.languages.forEach(([e, n]) => { const k = LANG[e] || e; byLang[k] = (byLang[k] || 0) + n; });
  const langs = Object.entries(byLang).sort((a, b) => b[1] - a[1]);
  const langbar = el("span", { class: "langbar", title: langs.map(([k, n]) => `${k} ${Math.round(n * 100 / total)}%`).join(" · ") });
  langs.forEach(([, n], i) => langbar.append(el("span", { style: `width:${n * 100 / total}%;background:${LANG_COLORS[i % 6]}` })));
  const parts = CH ? Object.values(CH.cards).filter((c) => !c.inside).length : 0;
  $("footer").append(el("div", {}, langbar, langs.filter(([, n]) => n / total >= 0.03).map(([k, n]) => `${k} ${Math.round(n * 100 / total)}%`).join(" · "), " · ",
      el("b", {}, fmt(st.lines)), " lines in ", el("b", {}, String(st.files)), " files · ", el("b", {}, String(st.cards)), ` parts${st.levels > 1 ? ` on ${st.levels} levels` : ""} · `,
      el("b", {}, String(st.tests)), " test files",
      CH && (CH.totals.files || CH.removed_cards.length) ? [" · ", el("button", { type: "button", class: "linky", onclick: () => nav("#/changes") }, `${plural(parts, "part")} changed since ${CH.label}`)] : null),
    el("div", {}, `Built ${meta.built} from commit `, el("code", {}, meta.commit + (meta.dirty ? " + uncommitted changes" : "")),
      ` · ${M.anchors} names checked against the source · ${gr.mapped_files} of ${gr.source_files} source files on a card`),
    el("div", {}, `${gr.wires} links: ${gr.imports} match imports in the code, ${gr.via} name the line of code behind them, ${gr.declared} cross a process boundary or touch no code`,
      gr.undrawn ? el("span", {}, " · ", el("button", { type: "button", class: "linky", onclick: () => { toggles.deps(true); nav("#/level/"); } }, `${gr.undrawn} real import link${gr.undrawn > 1 ? "s" : ""} not drawn: show`)) : null),
    el("div", {}, "Refresh: ", el("code", {}, "python3 ~/.agents/templates/code_map.py build")));
  if (!CH) { $("changes").disabled = true; $("changes").title = "No earlier map to compare with yet: the next build shows what changed"; }
  pathsMenu();
  addEventListener("popstate", route); addEventListener("hashchange", route);
  route();
  function relayout() {
    sizes();
    if (view === "overview") { if (ov.narrow !== narrowScreen()) showOverview(); else if (OV.spine.length) ovDrawSoon(); }  // a narrow screen orders the overview anew
    if (levelShown()) { $("grid").style.padding = ""; fitColumns(L()); fitZoom(); drawSoon(); }
    if (view === "path") mmDrawSoon();
  }
  addEventListener("resize", () => { relayout(); fitLifecycles(); });
  document.fonts?.ready.then(relayout);
})();
</script>
</body>
