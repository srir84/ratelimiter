in = "core"
role = "Permits, slots, retention"
kind = "core"
purpose = "An allowed permit holds its signed receipt, a receipt slot and a refund slot until a transition frees them; both slots are reserved together, without waiting, so full means busy."
why = "The queue's capacity equals the refund slots, so Release's enqueue cannot fail; the compare-and-swap frees slots once and emits at most one event (DESIGN §A5.5)."
