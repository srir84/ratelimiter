# src: internal/fingerprint/fingerprint.go Of (the policy settings' hash); internal/core/epochwatch.go epochWatch.next (a record whose fingerprint differs gives mismatch, so only a matching epoch is joined)
[[term]]
name = "fingerprint"
meaning = "A hash of the policy settings. An instance joins an epoch only when its own fingerprint matches the epoch's."
card = "core.watch"

# src: SPEC.md §0 glossary "Quarantine", STA-10 (a flag written when per-key state loss is found; the key resumes only after an operator's restore and clear, ADM-2 and ADM-3, or a new epoch); internal/scripts/acquire.lua line 14 (a quarantined key is refused); cmd/rladmin/commands.go restoreKey, clearKey
[[term]]
