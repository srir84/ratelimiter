# src: SPEC.md §0 glossary "Permit" ("What acquire returns on an allow. The host finishes it with release() (confirmed failure) or done() (anything else)")
[[term]]
name = "permit"
meaning = "What an allowed Acquire returns. The app ends it with Done, or with Release if the work surely failed."
card = "core.permits"

# src: internal/core/slots.go tryAcquire ("reserves one receipt slot and one refund slot, or neither ... when either kind is full (busy)"), newSlots (maxReceipts, maxRefunds)
[[term]]
name = "slot"
meaning = "An allowed permit reserves one receipt slot and one refund slot from its instance's fixed supply; none free means busy."
card = "core.permits"

# src: SPEC.md §0 glossary "Receipt" ("A signed, expiring proof of one deduction. Held and verified only by the issuing library instance (inside a permit)"); internal/receipt/signer.go HMACSigner
[[term]]
