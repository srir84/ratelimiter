# src: ARCHITECTURE.md §4.1; SPEC.md §0 glossary "Dependency deadline" ("Maximum time the library waits for one store call … default 2 s", CFG-8), API-1 (a later deadline is capped), API-12a (receipt_error: no permit, the charge stays), API-22; DESIGN.md §A5.3, §A5.4 (one deadline per call, "min(host deadline, start + D) with D = dependency deadline", the connection with the fewest commands in flight, "Sent", NOSCRIPT), §A5.7 ("Rollback check": the floors), §A3.3 (shared_key_malformed), §A4.2, §A4.3, §A4.9, §A5.9; step 1: limiter/limiter.go (Limiter = core.Limiter, a type alias in the public types block); internal/core/health.go readiness (settings_invalid, closing and no_epoch: not_ready; mismatch: config_error; lost and held: state_integrity_error; joined: ready); internal/core/slots.go tryAcquire (false at once when either kind is full: busy, nothing sent); internal/core/acquire.go acquire (validation_error before anything else), send (store.Unavailable: degraded under FailureMode Open, else unavailable), decide (1 allowed, 2 limited with RetryAfterNs, 20 config, 21 clock, 22 and 23 integrity, 24 capacity; 20 and 22 trigger the watch), allowed (a signing error is receipt_error, with no permit); internal/store/adapter.go call (one SCRIPT LOAD and one resend after NOSCRIPT, within the same deadline), pool.go connSet.pick (the ready connection with the lowest load); internal/scripts/prelude.lua enter (lines 271–282: the epoch record, its ID and fingerprint, the per-key KEYS, the floors, the clock; refusals 20, 21, 22, 25, and the store_rollback hold); internal/scripts/acquire.lua lines 12–17 (quarantine flag, check_key, quarantine or hold: step 10), 18–27 (a new key: the tracked-bucket cap at line 19, then a full bucket less one token at line 23), 29–30 (refill, limited with nothing written: step 11), 32–38 (the deduction, the saved bucket, index score and high-water mark, the reply: step 12); internal/store/reply.go Decode (the §A4.9 layout and range checks; a failure leaves outcome_unknown); doc-comments of each step's code; next: SPEC.md §0 glossary "Permit" (done(), or release() for a confirmed failure), internal/core/permit.go Permit.Done (OPEN → DONE keeps the charge)
[[journey]]
id = "acquire"
title = "One allowed Acquire"
proves = "Valkey takes exactly one token in one atomic step, and the app gets a permit with a signed receipt."
main = true
chapters = [
  [1, "The app calls Acquire for a key"],
  [4, "Local checks pass and room is reserved"],
  [6, "One script call goes to Valkey"],
  [9, "Valkey refills and takes one token"],
  [13, "The reply comes back and is checked"],
  [15, "The library signs a receipt"],
  [16, "The app gets a permit"],
]
steps = [
  ["limiter/limiter.go:Limiter", "The app holds a limiter.Limiter, the public type: it is the core's Limiter under another name, so Acquire runs in the core."],
  ["internal/core/acquire.go:Limiter.Acquire", "The app calls Acquire(ctx, key). The app's own deadline in ctx limits how long it waits, and every result is counted in a metric."],
  ["internal/keys/keys.go:Encode", "The key must be 1–256 bytes of valid UTF-8. It is then encoded into a safe store key name.",
   "Any other key fails at once with validation_error, and nothing is sent."],
  ["internal/core/health.go:Limiter.readiness", "Is this instance ready? It needs valid settings, no shutdown under way, and a joined epoch whose settings match its own.",
   "Bad settings, shutting down or no epoch: not_ready. Settings unlike the epoch's: config_error. A lost or held epoch: state_integrity_error."],
  ["internal/core/slots.go:slots.tryAcquire", "It reserves one receipt slot and one refund slot together, without waiting.",
   "Either kind full: busy, and nothing goes to Valkey."],
  ["internal/core/acquire.go:Limiter.send", "The receipt-lifetime clock starts. An acquire call goes to the adapter with the epoch's keys, the policy fingerprint, and the highest store time and generation seen, to catch rollbacks.",
   "Store unreachable: unavailable, or degraded (no charge) if the policy fails open."],
  ["internal/store/adapter.go:StoreAdapter.Call", "The adapter sends it on the least busy connection, within the app's deadline and the store-call limit (2 s default).",
   "NOSCRIPT, proof it never ran, gets one reload and resend; nothing else is resent."],
  ["internal/store/pipe.go:pipeConn.write", "The command is written right away, without waiting for earlier replies. The writer tracks which bytes left, so it knows for sure whether this command was sent."],
  ["internal/scripts/prelude.lua:enter", "Inside Valkey, the script starts with the prelude's shared checks: load the epoch record, match its ID and fingerprint, check key names and rollbacks, then read the clock once.",
   "A failed check refuses (config, clock or integrity error); a rollback also puts the epoch on hold."],
  ["internal/scripts/acquire.lua:12", "The script checks the key is not quarantined (locked), then checks its stored bucket before any write.",
   "A quarantined key is refused. Damage quarantines the key, or holds the whole epoch if a shared key is damaged."],
  ["internal/scripts/acquire.lua:29", "A known key is refilled for the time passed; a key seen for the first time starts full and takes its token at once (line 23).",
   "Under one token: limited, nothing written. A new key past the tracked-key cap: capacity_error."],
  ["internal/scripts/acquire.lua:32", "For a known key, one token is taken here. The script saves the bucket, its cleanup time and the latest store time, and replies with the generation, sequence and expiry."],
  ["internal/store/reply.go:Decode", "Back in Go, the reply is decoded: it must have the expected shape for its code, with every value in range.",
   "Any other reply makes the result outcome_unknown."],
  ["internal/core/acquire.go:Limiter.decide", "The reply becomes the result. On this path it is allowed, so the receipt is built next.",
   "Limited gets an exact retry-after time; epoch-wide refusals make the epoch watch re-read early."],
  ["internal/receipt/signer.go:HMACSigner.Sign", "The receipt says which token was taken and when it expires. It is signed with this instance's secret key (HMAC-SHA256).",
   "Signing fails: receipt_error, no permit, and the token stays spent."],
  ["internal/core/permit.go:newPermit", "Acquire returns allowed with an OPEN permit holding the receipt and both slots. If still open when the receipt's lifetime ends, a timer expires it."],
]
next = [["Work done: call Done, the token stays spent", ""], ["Work surely failed: call Release", "refund"]]

# src: ARCHITECTURE.md §4.2; DESIGN.md §A5.5, §A5.6 (a backoff timer "re-enqueues the job and never holds a worker"), §A5.7 (the floors), §A4.4, §A5.11; SPEC.md §0 glossary "Dependency deadline" ("Maximum time the library waits for one store call", default 2 s) (R38), API-1d (one final event emitted; a full queue drops it), API-1h; internal/core/permit.go Release (after Close began, OPEN → FINAL unresolved closed; on an EXPIRED permit, unresolved expired; nothing sent), transitions, expire (RELEASED → FINAL unresolved retention; an attempt in flight is cancelled); internal/core/refund.go refundAttempt (Verify first: a bad MAC is final receipt_invalid with no store call; then one Adapter.Call under the epoch the watch joined last, with its floors), refundRequest (Kind: store.Refund), classifyRefund (final: applied, already_applied, receipt_invalid, receipt_expired; retried: 20 config, 21 clock, 22 and 23 integrity, 24 capacity, 25 a library defect reported as outcome_unknown, plus unavailable, cancelled, outcome_unknown and capacity_error), retry and backoffDelay (min(max, initial × 2^n) × U[0.5, 1.0]; 50 ms and 1 s by default in internal/settings/settings.go DefaultInstance, as are the 128 workers and the 2 refund connections); internal/store/adapter.go Call (the Refund connection set, used only by refund workers; deadline start + D); internal/scripts/refund.lua lines 15–16 (another epoch: receipt_invalid; expired: receipt_expired), 17–26 (quarantine, check_key, generation and sequence), 27–29 (the marker: already_applied with the original credit time), 30–31 (marker caps: capacity_error, which classifyRefund retries), 33–35 (refill, a credit of one token capped at capacity, and the marker with the credit time); internal/core/listener.go emit (a full queue drops the event and counts it), deliver (recover); doc-comments of each step's code
[[journey]]
id = "refund"
title = "Refund after a confirmed failure"
proves = "Failed work's token returns at most once, even after a lost reply; the app hears at most one final event."
chapters = [
  [1, "The app releases the permit"],
  [4, "A worker checks the receipt"],
  [7, "The refund script runs in Valkey"],
  [11, "Final, or retry later"],
  [13, "The app may hear how it ended", "core.listener"],
]
steps = [
  ["internal/core/permit.go:Permit.Release", "The app's work surely failed, so it calls Release. Release returns at once, and the refund runs in the background while the app answers its caller.",
   "After Close began, or once the permit expired, nothing is sent and the event says unresolved."],
  ["internal/core/permit.go:lifecycle.fire", "An atomic compare-and-swap moves the permit OPEN → RELEASED. Only the call that wins the swap acts, so a permit can finish only once."],
  ["internal/core/refund.go:refunds.enqueue", "The refund job joins a queue, earliest release first. The queue has room for every refund slot, so it never overflows."],
  ["internal/core/refund.go:refunds.next", "A free worker (of 128 by default) takes the earliest job and starts an attempt. The receipt-lifetime timer can still cancel it."],
  ["internal/receipt/signer.go:HMACSigner.Verify", "The worker first checks the receipt's signature.",
   "A bad signature ends the job as receipt_invalid, and nothing is sent to Valkey."],
  ["internal/core/refund.go:Limiter.refundAttempt", "The worker builds one refund call under the epoch the instance last joined, with the same rollback guards as acquire."],
  ["internal/store/adapter.go:StoreAdapter.Call", "The refund call goes out on the separate refund connections, within the store-call limit."],
  ["internal/scripts/refund.lua:15", "In Valkey, after the prelude, the receipt must be from this epoch and not expired. Then come the quarantine, bucket and generation checks.",
   "Another epoch's receipt: receipt_invalid. An expired one: receipt_expired."],
  ["internal/scripts/refund.lua:29", "It looks for this receipt's marker, so a refund never counts twice.",
   "Marker found: already_applied, so a resend is safe."],
  ["internal/scripts/refund.lua:35", "The token is credited here: the bucket is refilled, one token goes back (capped at capacity), and a marker records when.",
   "Marker limits reached: capacity_error, retried later."],
  ["internal/core/refund.go:classifyRefund", "Applied, already applied, invalid and expired are final answers. Everything else, such as refusals, an unreachable store or an unknown outcome, is retried."],
  ["internal/core/refund.go:refunds.retry", "If the result is not final: a backoff timer (50 ms, doubling up to 1 s, with jitter) puts the job back in the queue at its original place."],
  ["internal/core/permit.go:Permit.finish", "Once a result is final: the permit moves RELEASED → FINAL, both slots are freed, and exactly one event follows.",
   "If the receipt's lifetime runs out first, Permit.expire ends it as unresolved."],
  ["internal/core/refund.go:refunds.emit", "The RefundEvent says which deduction it was, how the refund ended, how many commands were sent and when the credit happened. It is counted and queued for the listener."],
  ["internal/core/listener.go:listener.deliver", "One goroutine calls the app's listener, catching any panic.",
   "If the queue is full, the event is dropped and counted in Health.ListenerDrops."],
]
loop = [12, 4, "retry until a final result"]

