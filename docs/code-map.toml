# src: ARCHITECTURE.md §4.3, §3 (the store "grows with active keys and recent refunds"); SPEC.md STA-3, STA-4, STA-5 (every cleanup interval, default 5 s), STA-10, API-1f, ADM-1 (reclamation); DESIGN.md §A4.5, §A4.7, §A5.8; internal/core/cleanup.go runCleanup (a pass every cleanup_interval × U[0.9, 1.0]; 5 s by default in internal/settings/settings.go DefaultPolicy), runPass (readiness looked at before the pass lock: a not-ready instance returns at once, nothing sent; passes of one instance run one at a time), pass (due_entries with cutoff 0, its T0 kept as the cutoff; the next page only after the page completes, until a page is empty; reclaim after a complete pass, and only then; epochWideStop), duePage, steps (30 removed, 31 moved, 32 quarantined, 33 skipped; the first response that is no confirmed step stops the pass); internal/scripts/due_entries.lua line 16 (the ix members scored up to min(T0, cutoff), at most limit, in score order); internal/store/maint.go CleanupEntries (one cleanup_entry per member, in pipelines of at most 100) and the file's header (every command on the maintenance connection, so acquires never queue behind them); internal/scripts/cleanup_entry.lua lines 52–53 (entry gone or not yet due: skipped, nothing written), 58–61 (a quarantined key's entry moved past the pass), 64–68 (a damaged key quarantined, its entry moved), 71–77 (a bucket refilled to full, with x ≤ t and no unexpired marker: deleted with its markers and its entry), 79–89 (the expired markers removed, the entry re-scored later); internal/core/reclaim.go reclaim (after every completed pass, and only then: at most 10 SCAN calls, the keys outside the joined epoch's namespace sent to reclaim.lua); internal/scripts/reclaim.lua (unlinks only keys whose rl:e:<id>: prefix is not the current epoch's). Chapter 3 names the scripts box: the box rule's tie would give the store adapter, which only sends the steps
[[journey]]
id = "cleanup"
title = "One cleanup pass"
proves = "Idle full buckets and expired markers leave the store, and old epochs' keys are reclaimed after complete passes."
chapters = [
  [1, "A timer starts a pass"],
  [3, "Find what is due"],
  [5, "Clean each entry", "scripts"],
  [8, "Reclaim old-epoch keys"],
]
steps = [
  ["internal/core/cleanup.go:Limiter.runCleanup", "Every cleanup interval (5 s by default, with jitter), a timer starts one pass."],
  ["internal/core/cleanup.go:Limiter.runPass", "A pass runs only on a ready instance, one at a time.",
   "Not ready: it stops at once and sends nothing."],
  ["internal/core/cleanup.go:Limiter.duePage", "It reads one page of due index entries; the first page's time becomes the pass's cutoff."],
  ["internal/scripts/due_entries.lua:16", "In Valkey, the script returns the keys whose cleanup time has come."],
  ["internal/store/maint.go:CleanupEntries", "The adapter sends the cleanup script for every entry on the page, pipelined on its maintenance connection."],
  ["internal/scripts/cleanup_entry.lua:71", "It deletes a bucket refilled to full whose receipts and markers have all expired, else just its expired markers; an entry not yet due is skipped.",
   "A quarantined key's entry only moves past this pass; a damaged key is quarantined and its entry moved."],
  ["internal/core/cleanup.go:Limiter.steps", "Back in Go, each reply is counted: removed, moved, quarantined or skipped.",
   "A failed call stops the pass; an epoch-wide refusal asks the watch to read early."],
  ["internal/core/reclaim.go:Limiter.reclaim", "After a complete pass, and only then, keys left over from older epochs are removed."],
]
loop = [7, 3, "next page, until a page comes back empty"]

# src: DESIGN.md §B5, §B3 (the flowchart's DB step, "ctx = remaining P", and "the same context bounds the DB work": step 12) (R42), §B4, §B7, §B8, §C5, §A6, §A4.6; HARNESS.md §0 glossary "P" ("The harness's value for the limiter setting max_release_delay": step 11) and HAR-11 ("a per-instance deadline measured from just before acquire, enforced by cancellation") (R39), HTTP-13 ("If P passes during database work, the API cancels it"; "A slow acquire reply therefore shortens the time left for database work": step 12) (R43), §4 (step 1 "Empty the harness DB", step 4 "Start the resource sampler and the generator"), TRF-5, TRF-7 ("isolated data"), HAR-13 (a drop invalidates the run); cmd/orchestrator/main.go orchestrate (preflight refusals return exitRefused, 2, before the pid file and the run directory); cmd/orchestrator/run.go (runner.run: startPostgres then prepareDB; runner.instancesStep: startAPIs then waitReady; startSampler, then startHitgen, with no --interval; report: a report validate.py does not pass is marked invalid and the run fails, exitFailure, 1); internal/scripts/admin_start_epoch.lua lines 14–15 (epoch_exists without the replace flag), 20–46 (the record written); cmd/sampler/doc.go, main.go (interval 1 s by default), sampler.go (tick: processes' CPU and RSS, each API's /health and /metrics, rladmin status --json, the store's INFO; one samples.jsonl line) (R26); cmd/hitgen/sender.go (sender.send schedules the retries after a 429, at most retries.MaxExtra, which harness/config/scenario.go caps at 2, with the same IDs, after the hint plus the seeded jitter); harness/httpapi/hit.go Server.serveHit (P is "never cancelled with the request"; s.lim.Acquire(ctx, userID); limited is answered by writeLimited, 429 with Retry-After and retry_after_ms, and every other refusal by writeError, all before the database step) and httpapi.go Server.p ("max_release_delay: the deadline from just before acquire") (R39), and P "bounds the DB work too": s.db.Hit runs on the same ctx; harness/dbclient/dbclient.go Client.Hit ("ctx bounds the whole call (hitapi passes its P deadline)") (R42); harness/runlog/runlog.go Writer.Enqueue (a full channel drops the line and counts it); doc-comments of each step's code. Chapter 2 names the rladmin box: the box rule's three-way tie would give the orchestrator, which only runs rladmin
[[journey]]
id = "scenario"
title = "One scenario run through the harness"
proves = "A scenario's repeatable traffic runs through real processes, and its report is built and checked from saved logs only."
chapters = [
  [1, "Set up the run"],
  [4, "Start the epoch", "rladmin"],
  [7, "Start the apps and sampler"],
  [9, "Send the traffic"],
  [14, "Stop and build the report"],
]
steps = [
  ["cmd/orchestrator/main.go:orchestrate", "make run starts the orchestrator. After preflight checks it creates runs/<id>/, holding the merged config and an access-control file with fresh passwords.",
   "A failed preflight check refuses the run (exit 2) before anything starts."],
  ["cmd/orchestrator/run.go:runner.startStore", "It starts a fresh Valkey server, set up to save every write to disk, with its data in the run folder, and waits until it answers."],
  ["cmd/orchestrator/run.go:runner.run", "Then PostgreSQL: started unless already running, and its hits table emptied, so each run starts clean."],
  ["cmd/orchestrator/run.go:runner.startEpoch", "It runs rladmin start-epoch with the run's policy. The new epoch ID that rladmin prints is saved in context.json."],
  ["cmd/rladmin/commands.go:startEpoch", "rladmin picks a random 128-bit epoch ID and sends the start-epoch script with the policy's fingerprint, the data layout version and the clock source."],
  ["internal/scripts/admin_start_epoch.lua:20", "The script writes the new epoch record: ID, fingerprint, layout, clock, no hold, a starting time and zero counters.",
   "Without --replace, the script refuses if a readable epoch record exists."],
  ["cmd/orchestrator/run.go:runner.instancesStep", "It starts the hitapi apps, number N on port 8080+N, each with its own log and the run's config (or a per-app override), and polls /health until all are ready."],
  ["cmd/sampler/sampler.go:sampler.tick", "It starts the sampler before the traffic. Every second the sampler logs each process's CPU and memory, each app's health and metrics, and the store's stats."],
  ["cmd/hitgen/main.go:run", "Then hitgen: it plans the whole schedule from a seed and saves it before sending anything. Its 'sending' log line marks time zero."],
  ["cmd/hitgen/sender.go:sender.send", "Each planned request becomes a GET /hit with a user ID and request ID.",
   "A 429 gets at most two retries, same IDs, after the suggested wait plus jitter."],
  ["harness/httpapi/hit.go:Server.hit", "hitapi notes the arrival time, checks headers and takes an in-flight slot, then calls Acquire keyed by user ID, under a deadline the client cannot cancel.",
   "Limited answers 429 with a retry hint; any other refusal gets an error, and no row is written."],
  ["harness/dbclient/dbclient.go:Client.Hit", "If allowed, it inserts the row within the time left, reading the existing one if the insert added nothing. What it learns about the row picks Done or Release."],
  ["harness/runlog/runlog.go:Writer.Enqueue", "Its decision, request, release and refund records go to api-N.jsonl, one system call per line.",
   "A full queue counts a drop, and any drop invalidates the run."],
  ["cmd/orchestrator/run.go:runner.finishRun", "When hitgen finishes, each hitapi is told to stop (SIGTERM) and drains its refunds. The row count is saved, the sampler stops, and context.json is written."],
  ["report/build.py:build", "The Python report builder reads the saved logs line by line into report.json and report.md, including the per-window budget check's verdict."],
  ["report/validate.py:check", "Then the validator re-checks the report against the run's context and scenario. A valid baseline then freezes its thresholds.",
   "A failure marks the report invalid, and make run exits 1."],
]

# =============================================================================== lifecycles

# src: internal/core/permit.go (permitState incl. stateDegraded, permitEvent, transitions: RELEASED takes final_result, retention and drain_end; the Permit doc-comment: "a degraded one holds neither, and every call on it is a no-op"; newDegradedPermit); DESIGN.md §A5.5 ("[*] --> DEGRADED: acquire degraded"); SPEC API-1h (DEGRADED row), API-5
# State order (R24): no two neighbours share a transition, so every transition draws as an arc, the box stays narrow and DEGRADED's self-loop label shows in full
[[lifecycle]]
title = "A permit's life"
card = "core.permits"
states = ["OPEN", "DEGRADED", "EXPIRED", "RELEASED", "DONE", "FINAL"]
transitions = [
  ["OPEN", "RELEASED", "release(): job queued", "internal/core/permit.go:Permit.Release"],
  ["OPEN", "EXPIRED", "retention timer fires, slots freed", "internal/core/permit.go:Permit.expire"],
  ["OPEN", "DONE", "done(): charge stays, slots freed", "internal/core/permit.go:Permit.Done"],
  ["OPEN", "FINAL", "release() after Close: unresolved closed", "internal/core/permit.go:Permit.Release"],
  ["RELEASED", "FINAL", "final result, retention, or drain end", "internal/core/permit.go:transitions"],
  ["EXPIRED", "DONE", "done(), silent", "internal/core/permit.go:Permit.Done"],
  ["EXPIRED", "FINAL", "release(): unresolved expired, nothing sent", "internal/core/permit.go:Permit.Release"],
  ["DEGRADED", "DEGRADED", "done() or release() does nothing", "internal/core/permit.go:Permit"],
]
# src: internal/core/permit.go newPermit ("returns an OPEN permit"), newDegradedPermit ("a DEGRADED permit: no receipt, no slots"); internal/core/acquire.go:92 (store unreachable under the fail-open policy: Degraded with newDegradedPermit)
start = [
  ["OPEN", "Acquire allowed", "internal/core/permit.go:newPermit"],
  ["DEGRADED", "store down, policy fails open", "internal/core/permit.go:newDegradedPermit"],
]

# src: internal/core/epochwatch.go (watchState, epochWatch.next: before a join only a missing record keeps no_epoch; a held record gives held; from any state, a record missing after joining, a malformed record and a missing or malformed high-water mark give lost, lines 147–160 (R28); from any state, once the rollback checks pass (lines 162–167), a well-formed record whose fingerprint differs gives mismatch, line 168, so only a matching epoch is joined, lines 171–183 (R37)); DESIGN.md §A5.7 (each row is keyed by the read and what the instance remembers (whether it ever joined, its floors, the epochs it left), not by the state before (R41); integrity rows before the fingerprint row; the lost row: "missing after joining, epoch_record_malformed, hwm_missing, hwm_malformed"; "state 0, fingerprint differs": mismatch); ARCHITECTURE.md §4.4 ("a replacement epoch with a matching fingerprint is joined automatically"; "a restarted instance reports … state_lost for a malformed record, integrity_hold under a hold") and operator procedures ("Change the policy": new-settings instances wait in fingerprint_mismatch)
# Main exits only (R37): mismatch -> lost and held -> lost are left out, since their proposed label "record missing or bad" is false before any join, when a missing record keeps no_epoch (lines 150–152; L16), as are the "hold set" exits (L17) and the exits back to no_epoch. The new mismatch arcs come before the operator arcs: of the two back arcs that jump two states, the operator arc then rides lower, and its leg crosses a "fingerprint differs" label, not the word "matching". lost -> mismatch is the only new label between neighbours, at 19 characters (the longest is 20), so the box keeps its 1,124 px width
[[lifecycle]]
title = "The epoch watch's state"
card = "core.watch"
states = ["no_epoch", "joined", "mismatch", "lost", "held"]
transitions = [
  ["no_epoch", "joined", "matching record read", "internal/core/epochwatch.go:epochWatch.next"],
  ["no_epoch", "mismatch", "record's fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["no_epoch", "lost", "record malformed, high-water mark missing or bad", "internal/core/epochwatch.go:epochWatch.next"],
  ["no_epoch", "held", "record already on hold", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "mismatch", "fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "lost", "record or high-water mark missing or bad", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "held", "hold set, or rollback seen", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "joined", "switch to a matching replacement", "internal/core/epochwatch.go:epochWatch.next"],
  ["mismatch", "joined", "replacement matches", "internal/core/epochwatch.go:epochWatch.next"],
  ["lost", "mismatch", "fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["held", "mismatch", "fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["lost", "joined", "operator starts a matching new epoch", "internal/core/epochwatch.go:epochWatch.next"],
  ["held", "joined", "operator replaces it with a matching epoch", "internal/core/epochwatch.go:epochWatch.next"],
]
# src: internal/core/epochwatch.go watchState (wsNoEpoch is the zero value: "nothing read yet")
start = [["no_epoch", "instance starts"]]

