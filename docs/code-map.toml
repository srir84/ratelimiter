# src: ARCHITECTURE.md §2 (the refund worker "retries until final"); SPEC.md §0 glossary "Refund marker" ("this deduction was refunded"); internal/core/refund.go (the workers send the refund script and retry until a final result); internal/scripts/refund.lua lines 27–29 (a marker found: already_applied)
[[term]]
