# Code map data for ~/.agents/templates/code_map.py (build: python3 ~/.agents/templates/code_map.py build).
# The unit of work is one Acquire call: a host asks the library for budget, one Lua script in
# Valkey decides atomically, and the host gets a Result. Each card and journey names its source.

# src: README.md (opening paragraph: "a Go library that every instance of a host service imports", "one budget per key, kept in a dedicated Valkey store", "An allowed call returns a permit"); SPEC.md §0 glossary "Instance", "Token", "Permit", CMP-1, CMP-2; ARCHITECTURE.md §1.1 (the library inside each app instance, the store holding all shared state); internal/core/permit.go Permit.Release ("it returns at once, and the refund runs in the background"; it queues the refund job, whose outcome the listener event reports, so Release asks for the token back and does not promise it)
title = "Distributed token-bucket rate limiter"
summary = "A shared rate limiter: each copy of an app imports this Go library, and one Valkey server holds every key's tokens. An allowed call gets a permit; if the work fails, Release asks for the token back in the background."
# src: the main request's path, journey "acquire" (host → api → core → store → Valkey → scripts); each neighbour pair shares a drawn wire: host -> api, api -> core.acquire, core.acquire -> store, store -> valkey, valkey -> scripts
spine = ["host", "api", "core", "store", "valkey", "scripts"]

