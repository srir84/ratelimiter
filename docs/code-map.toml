# Code map data for ~/.agents/templates/code_map.py (build: python3 ~/.agents/templates/code_map.py build).
# The unit of work is one Acquire call: a host asks the library for budget, one Lua script in
# Valkey decides atomically, and the host gets a Result. Each card and journey names its source.

# src: README.md (opening paragraph); epoch: SPEC.md §0 glossary "Epoch", ARCHITECTURE.md §4.4 ("Only the admin tool creates an epoch. Instances only join")
title = "Distributed token-bucket rate limiter"
summary = "A Go library that every host instance imports: each decision runs as one atomic Lua script in a dedicated Valkey store, and an allowed call returns a permit with a signed receipt, so a confirmed failure gets its token back. An epoch is one lifetime of the shared state, with one fixed policy: only rladmin starts one, and instances only join it. A test harness plays a host and measures it."

# src: ARCHITECTURE.md §4.1 (allowed call; the script's "refill, deduct 1" in "a single atomic step", API-1a), §4.2 (confirmed failure and refund); DESIGN.md §A5.4 (the adapter sends the script); ARCHITECTURE.md AD-2 (one atomic step per call), AD-10 ("Each instance generates its own signing key in memory"); internal/receipt/signer.go HMACSigner.Sign ("MAC = HMAC-SHA256(key, MACInput(r))"), as journey 1 step 14 says ("under the instance's own key") (R40); internal/core/acquire.go Limiter.allowed (signs, then newPermit returns the OPEN permit); internal/core/permit.go Permit.Done (OPEN → DONE "keeps the charge"), Permit.Release (queues the refund job; "the refund runs in the background"). Stops 1–7 match the map's numbered steps 1–7, so stop 5 holds both Valkey's atomic run and the script's refill and take (R34), stop 6 names only the signing, on the blocks card, where step 6 lands, and leaves the permit to stop 7 (R40), and stop 7 sits on the permits card, where step 7 lands: it opens the core level, the only level that draws step 7 (R36).
[[story]]
label = "A host calls Acquire for one key"
card = "host"

[[story]]
label = "The public API is the only door"
card = "api"

[[story]]
label = "Local checks pass; both slots are reserved"
card = "core"

[[story]]
label = "The adapter sends one acquire script"
card = "store"

[[story]]
label = "Valkey runs it atomically: refill, take one token"
card = "scripts"

[[story]]
label = "The receipt is signed with the instance's key"
card = "blocks"

[[story]]
label = "Permit issued; Done keeps the charge, Release refunds"
card = "core.permits"

