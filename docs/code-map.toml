# =============================================================================== wires: the Acquire path

[[wire]]
from = "host"
to = "api"
label = "Acquire, then Done or Release"
kind = "call"
step = 1

[[wire]]
from = "operator"
to = "rladmin"
label = "start epochs, repair quarantined keys"
kind = "call"

[[wire]]
from = "api"
to = "core.acquire"
label = "Acquire runs in the core"
kind = "call"
step = 2

[[wire]]
from = "api"
to = "core.instance"
label = "New builds and starts an instance"
kind = "call"
via = "limiter/limiter.go:New"

# src: limiter/limiter.go (Permit = core.Permit); internal/core/permit.go (Permit.Done, Permit.Release)
[[wire]]
from = "api"
to = "core.permits"
label = "Done or Release finishes the permit"
kind = "call"
via = "limiter/limiter.go:Permit"

[[wire]]
from = "core.acquire"
to = "core.health"
label = "refuse locally unless ready"
kind = "call"
via = "internal/core/acquire.go:Limiter.acquire"

[[wire]]
from = "core.acquire"
to = "store"
label = "send one acquire script, never run twice"
kind = "call"
step = 3

[[wire]]
from = "store"
to = "valkey"
label = "send the script by its hash"
kind = "call"
step = 4
via = "internal/store/pipe.go:pipeConn.write"

[[wire]]
from = "valkey"
to = "scripts"
label = "run it atomically on the store clock"
kind = "call"
step = 5

# The store -> scripts import (the loader) is left to the Code links overlay; the NOSCRIPT repair wire tells the loading story (R25).
# Step 6 keeps one word so its number sits on its own wire at the top level, where "(+1)" is added; story stop 6 and journey 1 step 14 carry the full wording (R25). src: internal/core/acquire.go:168 (Sign after the reply)
[[wire]]
from = "core.acquire"
to = "blocks"
label = "sign"
kind = "call"
step = 6

[[wire]]
from = "core.acquire"
to = "core.permits"
label = "issue the permit holding both slots"
kind = "call"
step = 7
via = "internal/core/acquire.go:Limiter.allowed"

# ---- refunds, the watch, cleanup, construction

[[wire]]
from = "core.permits"
to = "core.refunds"
label = "Release queues the refund job"
kind = "async"
via = "internal/core/permit.go:Permit.apply"

[[wire]]
from = "core.refunds"
to = "blocks"
label = "verify the receipt MAC first"
kind = "call"

[[wire]]
from = "core.refunds"
to = "store"
label = "send the refund script"
kind = "call"

[[wire]]
from = "core.refunds"
to = "core.listener"
label = "hand over each final event"
kind = "async"
via = "internal/core/refund.go:refunds.emit"

[[wire]]
from = "core.listener"
