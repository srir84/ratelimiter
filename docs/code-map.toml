# src: ARCHITECTURE.md §4.1; SPEC.md §0 glossary "Dependency deadline" ("Maximum time the library waits for one store call … default 2 s", CFG-8), API-1 (a later deadline is capped); internal/core/acquire.go decide (1 allowed, 2 limited with RetryAfterNs, 20 config, 21 clock, 22 and 23 integrity, 24 capacity; 20 and 22 trigger the watch); DESIGN.md §A5.3, §A5.4 (one deadline per call, "min(host deadline, start + D) with D = dependency deadline", the connection with the fewest commands in flight, "Sent", NOSCRIPT), §A5.7 ("Rollback check": the floors), §A3.3 (shared_key_malformed), §A4.2, §A4.3, §A4.9, §A5.9; SPEC.md API-22; internal/scripts/acquire.lua lines 12–17 (quarantine flag, check_key, quarantine or hold), 19 (tracked-bucket cap), 29–30 (refill, limited); doc-comments of each step's code
[[journey]]
title = "One allowed Acquire, end to end"
proves = "One token is deducted atomically in the store, and the host gets a permit holding a signed receipt."
steps = [
  ["internal/core/acquire.go:Limiter.Acquire", "The host calls Acquire(ctx, key) on its limiter; ctx's deadline is the host's own, and every result is counted in rl_acquire_results_total."],
  ["internal/keys/keys.go:Encode", "The key must be 1–256 bytes of UTF-8, else the result is validation_error before anything else; it is encoded base64url for the store's key names."],
  ["internal/core/health.go:Limiter.readiness", "After the ctx check, one readiness look: invalid settings, closing or no epoch is not_ready, a fingerprint mismatch config_error, a lost or held epoch state_integrity_error."],
  ["internal/core/slots.go:slots.tryAcquire", "After the signer check, one receipt slot and one refund slot are reserved together without waiting; either full returns busy, and nothing is sent."],
  ["internal/core/acquire.go:Limiter.send", "The retention clock starts; one acquire call goes to the adapter with the joined epoch's keys, fingerprint and rollback floors: the highest high-water mark and generation the watch read."],
  ["internal/store/adapter.go:StoreAdapter.Call", "The adapter sends the script on the least-loaded connection, within the host deadline capped at D (dependency deadline, default 2 s); only NOSCRIPT, proof it never ran, gets one resend."],
  ["internal/store/pipe.go:pipeConn.write", "The command is written at once, pipelined; the writer tracks each command's byte range, so the bytes that left prove whether it was sent."],
  ["internal/scripts/prelude.lua:enter", "Inside Valkey the prelude loads the epoch record, matches the epoch ID and fingerprint, asserts the key names, checks the rollback floors, then reads the clock once."],
  ["internal/scripts/acquire.lua:12", "acquire.lua refuses a quarantined key, then check_key reads the bucket and its markers before any write; an inconsistent key is quarantined; a malformed shared key sets the epoch-wide hold."],
  ["internal/scripts/acquire.lua:19", "A new key needs a free tracked-bucket slot; a known key refills exactly up to the budget time, and under one token the script replies limited, writing nothing."],
  ["internal/scripts/acquire.lua:32", "Allowed: one token is taken; the bucket, its index due time and the high-water mark are written, and the reply carries generation, sequence and receipt expiry."],
  ["internal/store/reply.go:Decode", "The connection's reader matches the reply to its FIFO slot; it must fit the acquire layout and every range check, else the call is outcome_unknown."],
  ["internal/core/acquire.go:Limiter.decide", "The result follows the reply: allowed; limited, with an exact RetryAfterNs; or a config, clock, integrity or capacity refusal; epoch-wide config and integrity refusals ask the watch to read early."],
  ["internal/receipt/signer.go:HMACSigner.Sign", "The receipt (epoch, key, generation, sequence, issue and expiry times) is signed with HMAC-SHA256 under the instance's own key; a signing error is receipt_error."],
  ["internal/core/permit.go:newPermit", "Acquire returns Allowed with DecisionNs and an OPEN permit holding the receipt and both slots; its retention timer fires receipt_lifetime after the send."],
  ["internal/core/permit.go:Permit.Done", "The work succeeds and the host calls Done: OPEN → DONE keeps the charge and frees both slots."],
]

# src: ARCHITECTURE.md §4.2; DESIGN.md §A5.5, §A5.6 (a backoff timer "re-enqueues the job and never holds a worker"), §A5.7 (the floors), §A4.4, §A5.11; SPEC.md §0 glossary "Dependency deadline" ("Maximum time the library waits for one store call", default 2 s: step 6, refundAttempt's "within D") (R38), API-1d (one final event emitted; a full queue drops it); internal/core/refund.go classifyRefund (final: applied, already_applied, receipt_invalid, receipt_expired; retried: 20 config, 21 clock, 22 and 23 integrity, 24 capacity, 25 a library defect reported as outcome_unknown, plus unavailable, cancelled, outcome_unknown and capacity_error); doc-comments of each step's code
[[journey]]
title = "Refund after a confirmed failure"
proves = "A confirmed failure is credited at most once, even after a lost reply, and one final event is emitted."
steps = [
  ["internal/core/permit.go:Permit.Release", "The host's work failed for sure, so it calls Release, which returns at once; the host can reply to its caller while the refund runs in the background."],
  ["internal/core/permit.go:lifecycle.fire", "A compare-and-swap moves the permit OPEN → RELEASED; only the caller whose swap won performs the effects, so a permit finishes once."],
  ["internal/core/refund.go:refunds.enqueue", "The permit becomes pending and joins the ready queue, earliest release first; the queue cannot fill, since its capacity is the refund slot count."],
  ["internal/core/refund.go:refunds.next", "One of the refund workers (128 by default) takes the earliest job and starts its attempt on a context the retention timer can cancel."],
  ["internal/receipt/signer.go:HMACSigner.Verify", "The worker checks the receipt's MAC first, in constant time; a mismatch is final receipt_invalid, and nothing goes to the store."],
  ["internal/core/refund.go:Limiter.refundAttempt", "One refund script goes out on the refund connections within the dependency deadline, under the watch's last joined epoch and its rollback floors: the highest high-water mark and generation read."],
  ["internal/scripts/refund.lua:15", "In the store, after the prelude, a receipt from another epoch is receipt_invalid and one at or past its expiry receipt_expired; then come the quarantine flag and check_key."],
  ["internal/scripts/refund.lua:29", "A marker already written for this receipt's generation and sequence replies already_applied with the original credit time, so resending after a lost reply is safe."],
  ["internal/scripts/refund.lua:35", "Otherwise, within the per-key and live marker caps, it refills, credits up to one token, and writes the marker holding the credit's budget time, indexed and counted."],
  ["internal/core/refund.go:classifyRefund", "applied, already_applied, receipt_invalid and receipt_expired are final; config, clock, integrity and capacity refusals, unavailable, cancelled and outcome_unknown are retried."],
  ["internal/core/refund.go:refunds.retry", "A lost reply is outcome_unknown: a backoff timer, 50 ms doubling to 1 s with jitter, puts the job back in the queue with its original release time."],
  ["internal/core/permit.go:Permit.finish", "A final result moves RELEASED → FINAL: the refund leaves the pending set, both slots are freed, and then exactly one event is emitted."],
  ["internal/core/refund.go:refunds.emit", "The RefundEvent carries the deduction ID, the result, the refund commands sent and the credit time; it is counted in rl_refund_results_total and queued for the listener."],
  ["internal/core/listener.go:listener.deliver", "One dispatcher goroutine calls the host's listener inside recover(); an event that finds the queue full is dropped and counted in Health.ListenerDrops."],
  ["internal/core/permit.go:Permit.expire", "If receipt_lifetime passes first, the retention timer ends the refund as unresolved (retention) and cancels any attempt in flight."],
]
loop = [11, 4, "retry until a final result"]

# src: DESIGN.md §B5, §B3 (the flowchart's DB step, "ctx = remaining P", and "the same context bounds the DB work": step 12) (R42), §B4, §B7, §B8, §C5, §A6, §A4.6; HARNESS.md §0 glossary "P" ("The harness's value for the limiter setting max_release_delay": step 11) and HAR-11 ("a per-instance deadline measured from just before acquire, enforced by cancellation") (R39), HTTP-13 ("If P passes during database work, the API cancels it"; "A slow acquire reply therefore shortens the time left for database work": step 12) (R43), §4 (step 1 "Empty the harness DB", step 4 "Start the resource sampler and the generator"), TRF-5, TRF-7 ("isolated data"); cmd/orchestrator/run.go (runner.run: startPostgres then prepareDB; runner.instancesStep: startAPIs then waitReady; startSampler, then startHitgen, with no --interval); cmd/sampler/doc.go, main.go (interval 1 s by default), sampler.go (tick: processes' CPU and RSS, each API's /health and /metrics, rladmin status --json, the store's INFO; one samples.jsonl line) (R26); cmd/hitgen/sender.go (sender.send schedules the retries); harness/httpapi/hit.go Server.serveHit (P is "never cancelled with the request"; s.lim.Acquire(ctx, userID)) and httpapi.go Server.p ("max_release_delay: the deadline from just before acquire") (R39), and P "bounds the DB work too": s.db.Hit runs on the same ctx; harness/dbclient/dbclient.go Client.Hit ("ctx bounds the whole call (hitapi passes its P deadline)") (R42); doc-comments of each step's code
[[journey]]
title = "One scenario run through the harness"
proves = "One scenario's seeded traffic runs through real processes, and its report is built and checked from saved evidence alone."
steps = [
  ["cmd/orchestrator/main.go:orchestrate", "make run starts bin/test/orchestrator: preflight checks, the pid file, then runs/<id>/ with the merged config.toml and an ACL file rendered with fresh passwords."],
  ["cmd/orchestrator/run.go:runner.startStore", "Child process: valkey-server with the durable profile, its data in runs/<id>/store; the orchestrator waits until it answers PING as rl_ops."],
  ["cmd/orchestrator/run.go:runner.run", "Then PostgreSQL: started with pg_ctl unless it already runs, and the hits table emptied, so each run's data is isolated (HARNESS §4 step 1, TRF-7)."],
  ["cmd/orchestrator/run.go:runner.startEpoch", "Child process: rladmin start-epoch --policy runs/<id>/config.toml --json as rl_admin; the epoch ID it prints goes into context.json."],
  ["cmd/rladmin/commands.go:startEpoch", "rladmin draws a new 128-bit epoch ID from crypto/rand and sends admin_start_epoch with the policy's fingerprint, schema 1 and the clock source."],
  ["internal/scripts/admin_start_epoch.lua:20", "Without --replace the script refuses a readable record; then it writes the new epoch record: ID, fingerprint, schema, clock, empty hold, high-water mark and zero counters."],
  ["cmd/orchestrator/run.go:runner.instancesStep", "Child processes: hitapi N on 127.0.0.1:8080+N with the run's config and its api-N.jsonl log; the orchestrator polls GET /health until every instance is ready."],
  ["cmd/sampler/sampler.go:sampler.tick", "Child process: the sampler, started before hitgen, writes one samples.jsonl line every second: each process's CPU and RSS, each API's /health and /metrics, rladmin status and the store's INFO."],
  ["cmd/hitgen/main.go:run", "Child process: hitgen builds the seeded schedule, writes schedule.jsonl before anything is sent, opens gen.jsonl and logs 'sending', which marks t0."],
  ["cmd/hitgen/sender.go:sender.send", "Each due entry becomes one GET /hit with X-User-ID and X-Request-ID; a 429 schedules at most two retries with the same IDs, after the hint plus jitter."],
  ["harness/httpapi/hit.go:Server.serveHit", "After the arrival time, header checks and an in-flight slot, hitapi calls Acquire in-process, keyed by user ID, under P (max_release_delay), a deadline the client cannot cancel."],
  ["harness/dbclient/dbclient.go:Client.Hit", "Allowed: in the time left in P, SQL INSERT … ON CONFLICT DO NOTHING RETURNING arrival_ns, then SELECT when nothing returned; the outcome class picks done() or release()."],
  ["harness/runlog/runlog.go:Writer.Enqueue", "The decision, request, release and refund records go to api-N.jsonl, one write(2) per line; a full channel counts a drop, and any drop invalidates the run."],
  ["cmd/orchestrator/run.go:runner.finishRun", "After hitgen exits: SIGTERM to each hitapi, which drains its refunds; the row count goes to db_rows.json, the sampler stops and context.json is written."],
  ["report/build.py:build", "Child process python3 -m report: the builder streams the saved run logs line by line into report.json and report.md, with check_bud11's verdict run in-process."],
  ["report/validate.py:check", "Then report/validate.py re-checks the report against context.json and the pinned scenario; a failure marks it invalid and make run exits 1; a valid baseline then freezes its thresholds."],
]

# =============================================================================== lifecycles

# src: internal/core/permit.go (permitState incl. stateDegraded, permitEvent, transitions: RELEASED takes final_result, retention and drain_end; the Permit doc-comment: "a degraded one holds neither, and every call on it is a no-op"; newDegradedPermit); DESIGN.md §A5.5 ("[*] --> DEGRADED: acquire degraded"); SPEC API-1h (DEGRADED row), API-5
# State order (R24): no two neighbours share a transition, so every transition draws as an arc, the box stays narrow and DEGRADED's self-loop label shows in full
[[lifecycle]]
title = "A permit's life"
card = "core.permits"
states = ["OPEN", "DEGRADED", "EXPIRED", "RELEASED", "DONE", "FINAL"]
transitions = [
  ["OPEN", "RELEASED", "release(): job queued", "internal/core/permit.go:Permit.Release"],
  ["OPEN", "EXPIRED", "retention timer fires, slots freed", "internal/core/permit.go:Permit.expire"],
  ["OPEN", "DONE", "done(): charge stays, slots freed", "internal/core/permit.go:Permit.Done"],
  ["OPEN", "FINAL", "release() after Close: unresolved closed", "internal/core/permit.go:Permit.Release"],
  ["RELEASED", "FINAL", "final result, retention, or drain end", "internal/core/permit.go:transitions"],
  ["EXPIRED", "DONE", "done(), silent", "internal/core/permit.go:Permit.Done"],
  ["EXPIRED", "FINAL", "release(): unresolved expired, nothing sent", "internal/core/permit.go:Permit.Release"],
  ["DEGRADED", "DEGRADED", "done() or release() does nothing", "internal/core/permit.go:Permit"],
]

# src: internal/core/epochwatch.go (watchState, epochWatch.next: before a join only a missing record keeps no_epoch; a held record gives held; from any state, a record missing after joining, a malformed record and a missing or malformed high-water mark give lost, lines 147–160 (R28); from any state, once the rollback checks pass (lines 162–167), a well-formed record whose fingerprint differs gives mismatch, line 168, so only a matching epoch is joined, lines 171–183 (R37)); DESIGN.md §A5.7 (each row is keyed by the read and what the instance remembers (whether it ever joined, its floors, the epochs it left), not by the state before (R41); integrity rows before the fingerprint row; the lost row: "missing after joining, epoch_record_malformed, hwm_missing, hwm_malformed"; "state 0, fingerprint differs": mismatch); ARCHITECTURE.md §4.4 ("a replacement epoch with a matching fingerprint is joined automatically"; "a restarted instance reports … state_lost for a malformed record, integrity_hold under a hold") and operator procedures ("Change the policy": new-settings instances wait in fingerprint_mismatch)
# Main exits only (R37): mismatch -> lost and held -> lost are left out, since their proposed label "record missing or bad" is false before any join, when a missing record keeps no_epoch (lines 150–152; L16), as are the "hold set" exits (L17) and the exits back to no_epoch. The new mismatch arcs come before the operator arcs: of the two back arcs that jump two states, the operator arc then rides lower, and its leg crosses a "fingerprint differs" label, not the word "matching". lost -> mismatch is the only new label between neighbours, at 19 characters (the longest is 20), so the box keeps its 1,124 px width
[[lifecycle]]
title = "The epoch watch's state"
card = "core.watch"
states = ["no_epoch", "joined", "mismatch", "lost", "held"]
transitions = [
  ["no_epoch", "joined", "matching record read", "internal/core/epochwatch.go:epochWatch.next"],
  ["no_epoch", "mismatch", "record's fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["no_epoch", "lost", "record malformed, high-water mark missing or bad", "internal/core/epochwatch.go:epochWatch.next"],
  ["no_epoch", "held", "record already on hold", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "mismatch", "fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "lost", "record or high-water mark missing or bad", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "held", "hold set, or rollback seen", "internal/core/epochwatch.go:epochWatch.next"],
  ["joined", "joined", "switch to a matching replacement", "internal/core/epochwatch.go:epochWatch.next"],
  ["mismatch", "joined", "replacement matches", "internal/core/epochwatch.go:epochWatch.next"],
  ["lost", "mismatch", "fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["held", "mismatch", "fingerprint differs", "internal/core/epochwatch.go:epochWatch.next"],
  ["lost", "joined", "operator starts a matching new epoch", "internal/core/epochwatch.go:epochWatch.next"],
  ["held", "joined", "operator replaces it with a matching epoch", "internal/core/epochwatch.go:epochWatch.next"],
]
