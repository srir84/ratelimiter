# src: SPEC.md §0 glossary "Epoch" ("One lifetime of the limiter's shared state, with one fixed policy"), ADM-1; ARCHITECTURE.md §4.4 ("Only the admin tool creates an epoch. Instances only join"); internal/core/epochwatch.go next (a record whose fingerprint matches is joined)
[[term]]
name = "epoch"
meaning = "One lifetime of the shared state under one policy. Only rladmin starts one; instances with matching settings join it."
