# Valkey durable profile (DESIGN §A2): production, benchmarks and durability tests.
# port, dir and aclfile are not set here: the process that starts the store passes them (plan choice).
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save ""
maxmemory 512mb
maxmemory-policy noeviction
maxclients 4096
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 1gb
bind 127.0.0.1
protected-mode yes
