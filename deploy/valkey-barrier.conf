# Valkey barrier profile (opt-in, SPEC STA-16a): appendfsync always, run only with the patched binary from
# deploy/build-valkey-barrier.sh, which syncs each write with F_BARRIERFSYNC on macOS. Valkey and OS crashes
# lose nothing; a power cut can lose the last few writes, in order. With stock Valkey this file equals durable.
# port, dir and aclfile are not set here: the process that starts the store passes them (plan choice).
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save ""
maxmemory 512mb
maxmemory-policy noeviction
maxclients 4096
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 1gb
bind 127.0.0.1
protected-mode yes
