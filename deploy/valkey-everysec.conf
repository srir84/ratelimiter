# Valkey once-a-second profile (opt-in, SPEC STA-16a): writes are forced to disk about once a second.
# An OS crash or power cut can lose ~1-2 s of decisions; a Valkey crash can too while a slow disk flush is running.
# port, dir and aclfile are not set here: the process that starts the store passes them (plan choice).
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save ""
maxmemory 512mb
maxmemory-policy noeviction
maxclients 4096
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 1gb
bind 127.0.0.1
protected-mode yes
