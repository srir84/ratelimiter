# Valkey fast profile (DESIGN §A2): logic tests only; never for durability tests or benchmarks.
# port, dir and aclfile are not set here: the process that starts the store passes them (plan choice).
appendonly yes
appendfsync no
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save ""
maxmemory 128mb
maxmemory-policy noeviction
maxclients 4096
auto-aof-rewrite-percentage 0
auto-aof-rewrite-min-size 1gb
bind 127.0.0.1
protected-mode yes
