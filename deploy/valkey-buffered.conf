# Valkey buffered profile (opt-in, SPEC STA-16a): each write reaches the OS before the reply; the OS decides
# when it reaches disk. A Valkey crash loses nothing; an OS crash or power cut can lose ~30 s or more.
# port, dir and aclfile are not set here: the process that starts the store passes them (plan choice).
appendonly yes
appendfsync no
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save ""
maxmemory 512mb
maxmemory-policy noeviction
maxclients 4096
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 1gb
bind 127.0.0.1
protected-mode yes
